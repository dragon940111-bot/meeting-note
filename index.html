<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}

button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}

.prog{height:4px;background:var(--soft);border-radius:4px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.sync{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}

.tab.on{background:var(--ink);color:var(--bg)}
.tab .n{font-size:11px;opacity:.7;margin-left:4px}
main{padding:6px 14px calc(110px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.layout{display:block}
@media (min-width:900px){.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
 .list{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;padding-right:4px}
 .detail-pane{display:block}.inline-detail{display:none!important}}

.body{padding:0 12px 14px;border-top:1px solid var(--line)}
.why{margin:10px 0 4px;font-size:14.5px}.why b,.tip b{color:var(--acc);font-weight:600;margin-right:4px}

.status{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}

.status button.on.asked{background:var(--ok);color:#fff;border-color:var(--ok)}
.status button.on.later{background:var(--warn);color:#fff;border-color:var(--warn)}

.lbl{font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:600}

.on>.bh .chk,.chk.on{background:var(--acc);border-color:var(--acc)}
.bh .a{flex:1;font-weight:600;font-size:14.5px}.bh .penq{flex:none;padding:6px 12px;font-size:16px;border-radius:99px}
.bb{padding:8px 12px 12px;display:none}.br.on .bb{display:block}

.sub:last-child{border-bottom:none}

.sub .v{flex:1;font-size:14px}
.sub .chk{width:22px;height:22px;border-width:2px;cursor:pointer}
.react{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.react button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:12px}
.react button.on{background:var(--ink);color:var(--bg)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:15px;resize:vertical}
textarea{min-height:44px}
.small{font-size:13px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}

.btn.danger{color:var(--no)}

.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:6px;font-size:11px;padding:2px 6px}
.fig{margin-top:10px}.fig .cap{font-size:12px;color:var(--sub);margin:8px 0 4px}
.fig .flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}.fig .flow i{color:var(--sub);font-style:normal}.fig .st{padding:3px 8px;border-radius:99px;background:var(--soft)}
.fig .tree{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0}.fig .mono{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
.fig .ok{color:var(--ok);font-size:12px}.fig .no{color:var(--no);font-size:12px}
.fig .chat{background:var(--soft);border-radius:12px;padding:10px;display:grid;gap:6px}.fig .bub{max-width:85%;padding:7px 10px;border-radius:14px;font-size:14px}
.fig .bub.me{justify-self:end;background:#fee500;color:#1c1c1e}.fig .bub.you{justify-self:start;background:var(--card)}.fig .s{color:var(--sub);font-size:12px}
.fig .tw{overflow-x:auto}.fig table{border-collapse:collapse;font-size:13px;width:100%}.fig th,.fig td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}.fig th{color:var(--sub);font-weight:500}
.fig .svg{width:100%;max-width:420px;display:block}.fig .t{font-size:11px;fill:var(--ink)}.fig .t.c{text-anchor:middle}.fig .t.s{fill:var(--sub);font-size:10px}.fig .t.w{fill:#fff}
.fig .bx{fill:var(--card);stroke:var(--line)}.fig .ar{stroke:var(--acc);stroke-width:2;fill:none;marker-end:url(#a)}.fig .pp{fill:var(--acc)}.fig .pp2{fill:var(--sub)}
.fig .shot{width:100%;border-radius:10px;border:1px solid var(--line)}.fig .shot.narrow{max-width:200px}
details.more{margin-top:8px}details.more summary{font-size:13px;color:var(--acc);cursor:pointer}
.empty{color:var(--sub);font-size:14px;padding:30px 10px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:10px}
.fab button{border:none;border-radius:99px;padding:14px 18px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab .f1{background:var(--ink);color:var(--bg)}.fab .f2{background:var(--acc);color:#fff}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.qn{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.qn .tm{font-size:11px;color:var(--sub)}
.hide-mine .mine{display:none!important}
.hide-mine .fig{display:block}
.fivemin .nonmust{display:none!important}
.banner{background:var(--warn2);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
/* 펜 */
.pad{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;padding:16px}
.pad.open{display:flex}
.pad .box{width:min(94vw,760px);height:min(64vh,560px);background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
@media (max-width:600px){.pad{align-items:flex-end;padding:0}.pad .box{width:100vw;height:62vh;border-radius:18px 18px 0 0}}
.pad .bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.pad .bar .ttl{flex:1;font-weight:600;font-size:14px;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;flex:none}
@media (max-width:600px){.pad .bar .ttl{flex-basis:100%}.pad .bar .btn{padding:6px 9px}}
.sw.on{border-color:var(--acc)}
.pad .wrapc{flex:1;position:relative;overflow:hidden;background:#fff}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad .hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:#888;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}.viewer.open{display:flex}.viewer img{max-width:94vw;max-height:84vh;border-radius:8px}.viewer span{color:#ddd;font-size:13px}
.gl{border-bottom:1.5px dotted var(--acc);cursor:help}
.terms{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin:2px 0 10px}
.terms .gl{border-bottom:none;background:var(--acc2);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:13px}
.export pre{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:10px;max-height:300px;overflow:auto}
</style>
<style id="hb-kit-css">/* 체크 · 메모 · 펜 — 구상 문서(그림자 칸 안)와 설명 화면(밖)에 같이 쓰는 꼴 */
.hb-ck{-webkit-appearance:none;appearance:none;border:0;background:none;padding:12px;margin:-12px -6px;cursor:pointer;display:inline-flex;align-items:center;vertical-align:middle;color:var(--hb-sub);font-weight:600;font-size:12px;line-height:1;font-family:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.hb-ck i{flex:none;width:20px;height:20px;border:1.6px solid var(--hb-sub);border-radius:6px;display:grid;place-items:center;font:700 13px/1 -apple-system,system-ui,sans-serif;font-style:normal;color:transparent;transition:background .15s,border-color .15s,color .15s;box-sizing:border-box}
.hb-ck i::after{content:"✓"}
.hb-ck.on i{background:var(--hb-ink);border-color:var(--hb-ink);color:var(--hb-bg)}
.hb-ck b{margin-left:6px;font-weight:600}
.hb-ck.on b{color:var(--hb-ink)}
.hb-ck.sm i{width:18px;height:18px;border-radius:5px;font-size:11.5px}
.hb-rc{float:right;display:inline-flex;align-items:center;gap:6px;margin:-1px 0 2px 10px;position:relative;z-index:1;line-height:1}
.hb-rc.inl{float:none;margin:0 0 0 8px;vertical-align:middle}
.hb-rc.blk{float:none;display:flex;justify-content:flex-end;margin:6px 0 0}
.hb-rc.fx{float:none;margin-left:auto}
.hb-mb{-webkit-appearance:none;appearance:none;border:0;background:none;color:var(--hb-sub);font-weight:600;font-size:12px;line-height:1;font-family:inherit;padding:0 1px;min-height:36px;min-width:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;position:relative;white-space:nowrap;touch-action:manipulation;vertical-align:middle}
.hb-mb>span{display:inline-block;border:1px solid var(--hb-line);border-radius:99px;padding:6px 11px;background:var(--hb-card);color:inherit;position:relative}
.hb-mb.has{color:var(--hb-ink)}.hb-mb.has>span{border-color:color-mix(in srgb,var(--hb-acc) 55%,transparent)}
.hb-mb.has>span::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--hb-acc);box-shadow:0 0 0 2px var(--hb-card)}
.hb-mb.open{color:var(--hb-ink)}.hb-mb.open>span{background:var(--hb-chip)}
.hb-rp{grid-column:1/-1;margin:2px 0 10px;clear:both}
.hb-mp{background:var(--hb-mbg);border:1px solid color-mix(in srgb,var(--hb-acc) 22%,var(--hb-line));border-radius:12px;padding:8px 10px 10px;text-align:left;font-size:15px;line-height:1.55;color:var(--hb-ink)}
.hb-mp .hb-lab{display:block;font-weight:600;font-size:11.5px;line-height:1.3;font-family:inherit;color:var(--hb-sub);margin:0 0 4px}
.hb-ta{display:block;width:100%;box-sizing:border-box;border:0;background:transparent;resize:none;font-size:15.5px;line-height:1.55;font-family:inherit;color:inherit;min-height:46px;padding:4px 2px;margin:0;outline:none;overflow:hidden;border-radius:0}
.hb-ta::placeholder{color:var(--hb-sub);opacity:.75}
.hb-mrow{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.hb-pen{-webkit-appearance:none;appearance:none;border:1px solid var(--hb-line);background:var(--hb-card);color:var(--hb-ink);border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;line-height:1;font-family:inherit;cursor:pointer;touch-action:manipulation}
.hb-saved{font-size:11px;color:var(--hb-sub);margin-left:auto}
.hb-thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.hb-thumbs:empty{display:none}
.hb-th{-webkit-appearance:none;appearance:none;width:104px;height:76px;border:1px solid var(--hb-line);border-radius:9px;overflow:hidden;background:#fff;padding:0;cursor:pointer;flex:none}
.hb-th img{width:100%;height:100%;object-fit:contain;display:block}
.hb-cardmine{margin:14px 0 12px;padding-top:12px;border-top:1px dashed var(--hb-line);clear:both}

.hb-cc{display:inline-flex;align-items:center;margin-right:2px}

.hb-gb{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:2px 0 8px;clear:both}
.hb-gp{margin:0 0 12px}
@keyframes hbflash{0%{box-shadow:0 0 0 3px var(--hb-acc)}100%{box-shadow:0 0 0 3px transparent}}
.hb-flash{animation:hbflash 1.8s ease-out}
.hb-hide{display:none!important}
.hb-hidemine .hb-rc,.hb-hidemine .hb-cc,.hb-hidemine .hb-cardmine,.hb-hidemine .hb-rp,.hb-hidemine .hb-gb,.hb-hidemine .hb-gp,.hb-hidemine .hb-badge{display:none!important}
.hb-pen,.hb-th{min-height:44px}
.hb-pen{padding:0 15px}
.hb-rc{gap:8px}
.hb-rc.indt{float:right;margin:-2px 0 0 8px}
.hb-rc.indt.under{float:none;display:flex;margin:6px 0 2px;gap:8px}
.hb-rc.hb-gsum{float:none;margin-left:auto}
.hb-cardmine{grid-column:1/-1}
.hb-rc.blk{grid-column:1/-1}
/* 빠르게: 화면 밖 안(카드)은 그리지 않음 */
[data-idea]{content-visibility:auto;contain-intrinsic-size:auto 640px}
details[data-idea]:not([open]){contain-intrinsic-size:auto 76px}

.hb-rc.hb-g{white-space:nowrap}

.hb-pctl{display:none}

.hb-pctl button{pointer-events:auto;border:0;border-radius:99px;background:color-mix(in srgb,var(--hb-ink) 78%,transparent);color:var(--hb-bg);height:48px;min-width:52px;padding:0 16px;font:700 16px var(--hb-sans);cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.2)}

/* 누를 자리 넓히기(보이는 크기는 그대로) */
.hb-seg button::before{content:"";position:absolute;inset:-4px 0}
/* ---------- 넓은 화면(아이패드 가로 · 노트북): 왼쪽 고정 목차 ---------- */
#hb-side{position:fixed;top:0;bottom:0;left:0;width:var(--hb-sidew);z-index:42;background:var(--hb-card);border-right:1px solid var(--hb-line);overflow-y:auto;-webkit-overflow-scrolling:touch;font-family:var(--hb-sans);color:var(--hb-ink);padding:calc(env(safe-area-inset-top) + 12px) 10px calc(24px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}

.hb-sapp button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--hb-ink);text-align:left;font:600 14px/1.25 var(--hb-sans);padding:0 10px;min-height:44px;border-radius:11px;cursor:pointer}

.hb-wonly{display:none!important}
body.hb-side-on .hb-wonly{display:inline-flex!important;align-items:center;justify-content:center}
body.hb-side-on .hb-nwonly{display:none!important}
body.hb-side-on #hb-head,body.hb-side-on .hb-dochost,body.hb-side-on #view-meet{margin-left:var(--hb-sidew)}
@media (min-width:1440px){:root{--hb-sidew:288px}}
body.hb-side-on #hb-fab{bottom:calc(20px + env(safe-area-inset-bottom))}
body.hb-side-on .hb-back{bottom:calc(24px + env(safe-area-inset-bottom));left:calc(var(--hb-sidew) + 16px)}

}

/* 가로(아이패드 가로 · 노트북): 머리 띠를 한 줄로, 위아래 여백 줄임 */
body.hb-side-on #hb-head{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;padding-top:calc(env(safe-area-inset-top) + 5px);padding-bottom:5px}
body.hb-side-on .hb-h1{flex:1 1 360px;margin:0;max-width:none;order:1}
body.hb-side-on .hb-h2{flex:0 1 auto;margin:0;max-width:none;order:2}
body.hb-side-on .hb-sync{flex-basis:100%;margin:0;max-width:none;order:3}
body.hb-side-on .hb-fbanner{flex-basis:100%;margin:0;max-width:none;order:4}
.hb-ex2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:22px;align-items:start}
.hb-ex2 .hb-exm{position:sticky;top:calc(var(--hb-headh) + 12px)}
.hb-ex2 .hb-exm .hb-fig:first-child{margin-top:0}
.hb-ex2 .hb-ext>.hb-blk:first-child{margin-top:0}
.hb-ex1w .hb-ext{max-width:820px}
/* 세로(아이패드 세로): 위 칩 줄 */
#hb-chips{display:none}
@media (min-width:600px) and (max-width:1099px){#hb-chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:980px;margin:6px auto 0;padding-bottom:2px}#hb-chips::-webkit-scrollbar{display:none}}
#hb-chips button{flex:none;border:0;background:var(--hb-chip);color:var(--hb-ink);border-radius:99px;padding:0 13px;min-height:40px;font:600 12.5px var(--hb-sans);cursor:pointer;position:relative;white-space:nowrap}
#hb-chips button::before{content:"";position:absolute;inset:-4px 0}
#hb-chips button.on{background:var(--hb-ink);color:var(--hb-bg)}
.hb-ex2 .hb-cmp{grid-template-columns:1fr}.hb-ex2 .hb-big{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}

/* ---------- 서비스 설명(세로 나열) ---------- */
.hb-exbody{font-family:var(--hb-sans);color:var(--hb-ink);background:var(--hb-bg);min-height:100vh}
.hb-exlist{max-width:940px;margin:0 auto;padding:16px 16px 0}
.hb-exhd{padding:14px 4px 6px}.hb-exhd h1{font-size:clamp(22px,3.6vw,30px);line-height:1.3;letter-spacing:-.02em;margin:6px 0 4px}.hb-sub2{font-size:13px;color:var(--hb-sub);margin:0}
.hb-exsec{font-size:clamp(19px,2.6vw,23px);letter-spacing:-.015em;margin:34px 4px 6px;line-height:1.35}.hb-exsec small{display:block;font-size:13px;font-weight:500;color:var(--hb-sub);margin-top:3px;letter-spacing:0}
.hb-exlist .hb-gb{margin:0 4px 8px}
.hb-ex{margin:0 0 14px;scroll-margin-top:calc(var(--hb-headh) + 8px)}
.hb-exn{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:99px;background:var(--hb-ink);color:var(--hb-bg);font-size:12px;font-weight:800}
.hb-ex h2{font-size:clamp(21px,3.2vw,28px)}
@media (max-width:520px){.hb-exlist{padding:10px 10px 0}}
body.hb-side-on .hb-exlist{max-width:1320px;padding:12px 18px 0}
body.hb-side-on .hb-ex{padding:18px 22px 14px}
/* ---------- 보여 주기(서비스 설명) ---------- */
body.hb-present #hb-head,body.hb-present #hb-bar,body.hb-present #hb-side,body.hb-present #hb-fab{display:none!important}
body.hb-present .hb-cardmine,body.hb-present .hb-rc,body.hb-present .hb-cc,body.hb-present .hb-badge,body.hb-present .hb-talk,body.hb-present .hb-gb,body.hb-present .hb-gp,body.hb-present .hb-rp{display:none!important}
body.hb-present .hb-dochost{margin-left:0!important;padding-bottom:90px}
body.hb-present .hb-exlist{max-width:1180px;padding-top:calc(env(safe-area-inset-top) + 12px)}
body.hb-present .hb-ex{border:0;background:transparent;padding:10px 6px 26px;border-bottom:1px solid var(--hb-line);border-radius:0}

/* 문서 숨김: 그려 둔 것을 버리지 않고 화면에서만 뺌(다시 들어갈 때 빠르게) */
.hb-dochost.hb-off{content-visibility:hidden;position:absolute;left:0;right:0;top:0;height:0;min-height:0;padding:0;overflow:hidden;visibility:hidden;pointer-events:none}
.hb-loading{padding:80px 20px;text-align:center;font:15px var(--hb-sans);color:var(--hb-sub)}
/* 미팅 노트 덧붙이기 */
.hb-top5{margin:2px 14px 6px;border:1px solid var(--line,#e2e0db);border-radius:12px;background:var(--card,#fff);padding:0 12px;font-size:13.5px;max-width:1180px}
@media (min-width:1180px){.hb-top5{margin:2px auto 6px}}
.hb-top5 summary,.hb-qmap summary,.hb-newq summary{cursor:pointer;font-weight:700;padding:10px 0;min-height:24px}
.hb-top5 summary small,.hb-qmap summary small,.hb-newq summary small{font-weight:500;color:var(--sub,#6c6c72);margin-left:6px}
.hb-top5 ol{margin:0 0 6px;padding-left:20px}.hb-top5 li{margin:4px 0}
.hb-qlink{border:0;background:none;text-align:left;padding:6px 0;font:inherit;color:inherit;cursor:pointer;min-height:36px}

.hb-qcard b{grid-row:span 2;color:var(--acc,#3a5bd9);font-size:13px;align-self:center}.hb-qcard span{font-size:14px;font-weight:600}.hb-qcard small{font-size:12px;color:var(--sub,#6c6c72)}

.hb-ins-fig{margin:0;color:var(--hb-ink)}.hb-ins-fig svg{display:block;width:100%;height:auto;font-family:var(--hb-sans)}
.hb-ins-fig figcaption{font-size:11.5px;color:var(--hb-sub);text-align:center;margin-top:2px}
.hb-ins-ul{margin:0;padding-left:18px}.hb-ins-ul li{margin:6px 0;font-size:14px;line-height:1.6}

/* 글꼴 한 벌(미팅 노트 본문도 같은 순서) · 낱말 가운데서 끊지 않기 */
html body{font-family:var(--hb-sans)}
#hb-home,#hb-head,#hb-side,#hb-bar,#hb-fab,.hb-sheet,.hb-exbody,.hb-top5,.hb-qmap,.hb-newq,.hb-toast,.hb-viewer,.hb-back,.hb-pctl,.hb-loading{word-break:keep-all;overflow-wrap:break-word}

@media (max-width:600px){.hb-tw{position:relative}.hb-tw::before{content:"← 옆으로 밀어서 보기 →";display:block;position:sticky;left:0;font-size:11px;color:var(--hb-sub);padding:4px 10px;background:var(--hb-bg);border-bottom:1px solid var(--hb-line)}}
/* 접기 머리 · 칩: 누를 높이 */
.hb-talk summary{min-height:44px;display:flex;align-items:center;padding:0}
#view-meet details.more>summary{min-height:44px;display:flex;align-items:center}

.hb-top5 ol{padding-left:26px;list-style-position:outside}
@media (pointer:coarse){.hb-seg button{min-height:44px}.hb-terms button{min-height:44px}.hb-qlink{min-height:44px}}
</style>

<script id="content" type="application/json">{"K": [{"id": "K0", "t": "자료를 개발 · 시험에 써도 된다는 허락, 카톡 한 줄로 받을 수 있을까요?", "why": "지금 허브는 가짜 사진(우리가 만든 시험용 사진)으로만 시험해 봤어요. 진짜 대회 사진이 있어야 '허브가 선수를 몇 % 맞게 찾는지'를 잴 수 있어요. 예를 들어 사진 100장 가운데 90장을 맞는 선수에게 나눴다면 90%예요. 남의 사진 · 얼굴이 들어 있는 자료라 허락을 글로 남겨 둬야 나중에 서로 편해요.", "tip": "\"대회 사진이랑 상담 내용 몇 개를 개발 시험에만 쓰고 밖으로는 안 내보낼게요. 괜찮으시면 카톡으로 한 줄만 남겨 주세요.\"", "br": [{"a": "다 써도 돼요", "n": "AI가 사진을 봐도 되는지 · 개발 기록에 진짜 화면을 실어도 되는지(허락의 범위 — '확인' 탭 첫 물음)", "c": "자료 받기를 바로 시작", "s": "카톡 한 줄 예시를 보여 드리고 그 자리에서 받기"}, {"a": "대회 사진만요", "n": "상담 · 가격표는 언제쯤 괜찮은지", "c": "상담 답장 초안 시험은 미룸", "s": "가린 캡처(이름 · 번호 가림)면 괜찮은지 다시 여쭙기"}, {"a": "개인정보가 걱정돼요", "n": "어떤 게 가장 걱정되시는지(얼굴 · 연락처 · 유출)", "c": "다루는 규칙을 먼저 정함", "s": "① 자료는 경일 SSD 밖으로 안 나감 ② 얼굴은 동의 전엔 안 씀 ③ 기록 사진은 가린 것만 ④ 다 쓰면 돌려드림"}, {"a": "아직은 안 돼요", "n": "다음 대회 때 옆에서 보기만은 괜찮은지", "c": "가짜 자료로 계속 + 현장 참관", "s": "자료 없이도 할 수 있는 것(일정 · 예약 · 상담 초안)부터 보여 드리기"}], "fig": "<div class=\"chat\"><div class=\"bub me\">대표님, 지난 대회 사진이랑 상담 몇 개를 허브 개발 · 시험에만 쓰고 밖으로는 안 내보낼게요. 괜찮으실까요?<\/div><div class=\"bub you\">네 그렇게 쓰세요 👍 <span class='s'>← 이 한 줄이면 돼요(예시)<\/span><\/div><\/div>"}, {"id": "K1", "t": "지난 대회 하나 자료, 언제 · 어떻게 받을 수 있을까요?", "why": "진짜 사진을 봐야 카메라마다 시계가 몇 분씩 어긋나 있는지, 연사(한 번에 여러 장 이어 찍기)가 얼마나 많은지, 선수 참가번호(선수가 단 번호표)가 사진에 얼마나 잘 보이는지 알 수 있어요. 그래야 허브의 '선수 찾기' · '1차 셀렉'이 맞는지 잴 수 있어요. 대표님이 실제로 고른 사진은 '정답지'(허브가 고른 것과 견주는 기준)가 돼요.", "tip": "\"대회 하나 통째로요 — 메모리 카드에서 옮긴 그대로, 폴더 이름도 안 바꾼 채로요.\" (허브는 메모리 카드에서 막 옮긴 상태부터 일을 시작하니까, 그 상태 그대로가 시험에 맞아요 — 아래 '그림 · 예시 보기' 참고)", "br": [{"a": "지금 줄게요", "n": "어느 디스크에 있는지 · 얼마나 큰지", "c": "오늘 받아 감", "s": "빈 외장 디스크를 들고 가거나, 하루치 · 한 체급만 먼저"}, {"a": "드라이브(클라우드)에 있어요", "n": "링크로 받아도 되는지 · 링크를 언제까지 열어 두실 수 있는지", "c": "집에서 내려받기", "s": "폴더 구조 그대로 내려받기"}, {"a": "메모리 카드는 지웠고 보정본만 있어요", "n": "보정본이 몇 장인지 · 누가 무엇을 샀는지 기록이 있는지", "c": "원본 대신 보정본으로 시험", "s": "보정본으로도 카메라 본체 번호는 읽혀요(앞서 본식 사진 120장으로 확인해 봄). 그래서 선수 찾기 시험은 할 수 있어요"}, {"a": "어느 대회를 줄까요?", "n": "촬영자가 2명 이상이었는지 · 선수 수", "c": "고를 기준이 생김", "s": "선수 50~200명, 만들고 있어요.", "tip": "맥이면 왼쪽 위 사과 메뉴 → '이 Mac에 관하여', 윈도우면 시작 단추 옆 검색에 '시스템 정보' — 그 화면을 사진으로 찍어 오기.", "br": [{"a": "윈도우 PC 있어요", "n": "사양(그래픽 카드 · 메모리 · 저장 공간)", "c": "그 PC에 깔 준비", "s": ""}, {"a": "맥만 있어요", "n": "맥에서 윈도우를 쓰는지(부트캠프 / 창 안의 윈도우)", "c": "깔 곳을 다시 정함", "s": "작은 윈도우 PC를 하나 두거나 경일 노트북으로 시연"}, {"a": "노트북도 있어요", "n": "대회장에 들고 가는지", "c": "대회장에서 쓰는 시험도 할 수 있음", "s": ""}], "fig": ""}, {"id": "C3", "t": "고르기 · 보정 · 납품 · 예약에 각각 어떤 프로그램을 쓰세요?", "why": "허브는 대표님이 이미 쓰시는 프로그램과 이어서 일해요(예: 대표님이 라이트룸에서 매긴 별점을 허브가 읽어 오기). 프로그램이 다르면 잇는 방법이 달라요.", "tip": "아래 '그림 · 예시 보기'의 표를 보여 드리고 칸만 채워 달라고.", "br": [{"a": "라이트룸 Classic", "n": "어느 판(버전)인지 · 카탈로그 파일이 어디 있는지", "c": "지금 설계 그대로", "s": ""}, {"a": "캡처원 · 포토 메카닉", "n": "어느 단계에서 쓰는지(고르기 · 보정 등)", "c": "그 프로그램과 잇는 방법을 더함", "s": ""}, {"a": "AI 셀렉 · 보정을 이미 써요", "n": "어떤 프로그램인지 · 무엇이 불만인지", "c": "그 프로그램과 겹치는 기능은 허브에서 뺌", "s": "허브는 그 도구 앞 · 뒤 일(받기 · 선수 나누기 · 납품)에 집중"}], "fig": "<div class=\"tw\"><table><tr><th>단계<\/th><th>프로그램 (채워 오기)<\/th><\/tr><tr><td>받기 · 백업<\/td><td><\/td><\/tr><tr><td>고르기(셀렉)<\/td><td><\/td><\/tr><tr><td>보정<\/td><td><\/td><\/tr><tr><td>납품 · 보내기<\/td><td><\/td><\/tr><tr><td>예약 · 상담<\/td><td><\/td><\/tr><tr><td>정산<\/td><td><\/td><\/tr><\/table><\/div>"}, {"id": "C4", "t": "카메라는 뭘 쓰세요? RAW · JPEG을 같이 찍는지, 카메라 시계를 맞추는지도", "why": "허브는 카메라마다 '누가 찍었는지'를 가르고, 사진이 찍힌 시각을 순서표와 맞춰 체급 구간을 나눠요. 카메라 시계가 틀리면 구간이 어긋나요. 예를 들어 시계가 10분 늦은 카메라로 찍은 -75kg 사진이 다음 체급 사진으로 들어갈 수 있어요.", "tip": "", "br": [{"a": "같은 기종을 여러 대", "n": "JPEG만 찍는지", "c": "기종이 같은데 본체 번호까지 없으면 허브 눈에는 여러 대가 한 대로 보임", "s": "카메라 메뉴 '저작권 정보'에 작가 이름을 넣어 두면 갈려요"}, {"a": "RAW(+JPEG)", "n": "", "c": "좋음 — 그대로", "s": ""}, {"a": "JPEG만", "n": "소니 카메라인지", "c": "소니 JPEG에는 본체 번호가 안 적혀서 → 폴더(한 번에 올린 묶음)별로 누구 것인지 가름", "s": "위처럼 카메라 '저작권 정보'에 작가 이름 넣기"}, {"a": "시계를 안 맞춰요", "n": "카메라끼리 몇 분쯤 어긋나는지", "c": "허브가 카메라끼리 시간 차를 계산해 맞춰야 함", "s": "대회 전에 모든 카메라 시계를 휴대폰 시각에 맞춰 달라고 한 번만 부탁"}], "fig": ""}, {"id": "C5", "t": "사진은 어디에 두세요? 외장 디스크 · NAS, 백업은 두 곳인지, 폴더 이름은 어떻게 짓는지", "why": "허브의 '받기' · 백업 · 지울 것 기능이 대표님이 사진을 두는 방식에 맞춰져야 해요. 디스크를 여러 개 번갈아 꽂으면 꽂을 때마다 컴퓨터가 붙이는 글자(E: · F:)가 바뀌어서, 허브가 디스크 이름표로 알아봐야 해요.", "tip": "사진이 들어 있는 폴더 화면(폴더 이름이 보이게)을 사진으로.", "br": [{"a": "외장 디스크 여러 개", "n": "번갈아 꽂는지 · 이름을 붙였는지", "c": "허브가 디스크 이름표로 알아보고 보여 줌", "s": "디스크마다 이름 붙이기(예: 스튜디오SSD-1)"}, {"a": "NAS", "n": "NAS 기종 · 사진 폴더 경로", "c": "'받기' · 백업에 NAS 경로를 더함", "s": ""}, {"a": "백업이 한 곳뿐", "n": "사진을 잃어버린 적이 있는지", "c": "위험 — 그 한 곳이 고장 나면 사진이 없어짐 → 두 곳 복사가 중요해짐", "s": "두 곳에 복사가 끝나야 '메모리 카드 지워도 됨' 표시"}], "fig": "<div class=\"cap\">메모리 카드 → PC → 두 곳 (예시 그림)<\/div>\n<svg viewBox=\"0 0 320 110\" class=\"svg\">\n<rect x=\"6\" y=\"40\" width=\"56\" height=\"30\" rx=\"6\" class=\"bx\"/><text x=\"34\" y=\"59\" class=\"t c\">SD 카드<\/text>\n<rect x=\"106\" y=\"40\" width=\"60\" height=\"30\" rx=\"6\" class=\"bx\"/><text x=\"136\" y=\"59\" class=\"t c\">PC<\/text>\n<rect x=\"216\" y=\"10\" width=\"98\" height=\"30\" rx=\"6\" class=\"bx\"/><text x=\"265\" y=\"29\" class=\"t c\">외장 디스크<\/text>\n<rect x=\"216\" y=\"70\" width=\"98\" height=\"30\" rx=\"6\" class=\"bx\"/><text x=\"265\" y=\"89\" class=\"t c\">NAS · 드라이브<\/text>\n<path d=\"M62 55 H104\" class=\"ar\"/><path d=\"M166 50 L214 28\" class=\"ar\"/><path d=\"M166 60 L214 84\" class=\"ar\"/>\n<text x=\"70\" y=\"50\" class=\"t s\">복사<\/text><text x=\"168\" y=\"104\" class=\"t s\">두 곳에 있어야 안전<\/text><\/svg>"}, {"id": "C6", "t": "함께 일하는 사람은 몇 명이고, 누가 무슨 일을 맡나요?", "why": "허브에서 누가 무엇을 볼 수 있게 할지 정할 때 써요. 예를 들어 정산(돈 계산) · 손님 연락처는 대표님만 보게 하고, 그 화면을 대표님 암호로 잠그는 식이에요.", "tip": "", "br": [{"a": "대표님 혼자", "n": "", "c": "사람마다 화면을 나누는 일은 뒤로 미룸", "s": ""}, {"a": "직원이 있어요", "n": "직원에게 보이면 안 되는 것", "c": "대표님 · 직원 화면 나누기", "s": "대표님 암호로 정산 · 지울 것을 잠그기"}, {"a": "외부 작가가 와요", "n": "얼마나 자주 오는지 · 매번 같은 사람인지", "c": "'처음 본 카메라' 물음이 자주 뜸", "s": "외부 작가 카메라는 그때그때 묻지 않고, 프로젝트(대회 한 건)를 닫을 때 한 번에 알림(아직 안 정함 — 다음에 정할 것)"}], "fig": ""}], "B": [{"id": "B0", "t": "자료를 써도 된다는 허락 카톡 한 줄 (꼭 1)", "why": "'꼭' 탭 첫 번째 물음(허락 카톡 한 줄)과 같은 것이에요. 말로 한 허락은 나중에 서로 기억이 달라질 수 있어서 글(카톡)로 남겨요.", "tip": "", "br": [], "fig": ""}, {"id": "B1", "t": "지난 대회 하나 — 원본 · 최종으로 고른 사진 · 선수 명단 · 순서표 (꼭 2)", "why": "넷이 다 있어야 '선수 찾기'와 '1차 셀렉'이 대표님 기준에 맞는지 잴 수 있어요. 선수 명단은 사진 속 참가번호를 이름으로 바꿀 때, 순서표는 사진이 찍힌 시각을 보고 어느 체급 차례였는지 가를 때(체급 구간) 써요 — 아래 '그림 · 예시 보기' 참고.", "tip": "명단 · 순서표는 엑셀 · 사진 · 종이 무엇이든 괜찮다고.", "br": [{"a": "고른 결과가 라이트룸에 있어요", "n": "카탈로그 백업 파일(.lrcat)을 받을 수 있는지", "c": "정답지 바로 생김", "s": "카탈로그가 어려우면 별점만 뽑아 낸 목록도 괜찮아요"}, {"a": "고른 걸 따로 폴더에 모아요", "n": "그 폴더를 통째로", "c": "그 폴더가 곧 정답지", "s": ""}, {"a": "명단이 없어요", "n": "주최 측에는 명단이 있는지", "c": "이름 없이 참가번호만으로 시험", "s": ""}], "fig": "<div class=\"cap\">선수 명단 예시(가짜)<\/div><div class=\"tw\"><table><tr><th>번호<\/th><th>이름<\/th><th>종목<\/th><th>체급<\/th><\/tr><tr><td>137<\/td><td>김하늘<\/td><td>남자 보디<\/td><td>-75kg<\/td><\/tr><tr><td>52<\/td><td>박서준<\/td><td>클래식<\/td><td>-70kg<\/td><\/tr><\/table><\/div><div class=\"cap\">순서표 예시(가짜)<\/div><div class=\"tw\"><table><tr><th>시간<\/th><th>종목 · 체급<\/th><\/tr><tr><td>10:00<\/td><td>남자 보디 -75kg<\/td><\/tr><tr><td>10:40<\/td><td>클래식 -70kg<\/td><\/tr><\/table><\/div>"}, {"id": "B2", "t": "그 대회에서 누가 어떤 사진을 샀는지 기록", "why": "'번호로 꺼내기'와 판매 흐름을 실제처럼 시험해요. 예를 들어 '137번 선수가 사진 5장을 샀다'는 기록이 있으면, 허브가 그 선수 사진을 제대로 모아 오는지 견줘 볼 수 있어요.", "tip": "", "br": [{"a": "엑셀로 적어 둬요", "n": "", "c": "바로 시험", "s": ""}, {"a": "카톡으로만 주고받아요", "n": "이름 · 번호를 가린 대화 캡처 몇 개", "c": "카톡 대화에서 '누가 무엇을 샀는지' 뽑아 내는 시험", "s": ""}, {"a": "주최 측 쇼핑몰로 팔아요", "n": "주문 목록을 내려받을 수 있는지", "c": "허브가 쇼핑몰 주문 목록을 읽게 함", "s": ""}], "fig": ""}, {"id": "B3", "t": "상담 대화 10~20건(이름 가린 캡처)과 가격표 · 안내문 · 환불 규정", "why": "답장 초안이 대표님 말투와 규칙(가격 · 환불)을 지키게 하는 기준이에요. 답장 초안에 들어가는 가격 · 날짜 같은 숫자는 AI가 지어내지 않고, 허브 장부(가격표 등)에 적힌 것만 쓰게 만들 거예요.", "tip": "이름 · 전화번호는 가려 달라고.", "br": [{"a": "카카오톡 채널(톡채널)", "n": "대화 내보내기가 되는지", "c": "", "s": ""}, {"a": "개인 카톡 · 인스타", "n": "이름 · 번호를 가린 캡처", "c": "", "s": ""}, {"a": "가격표가 없어요", "n": "말로만 정해 두신 가격 · 규칙", "c": "답장 초안에 가격을 넣지 않음(가격은 사람이 직접 적음)", "s": ""}], "fig": "<div class=\"chat\"><div class=\"bub you\"><span class='blk'>████<\/span>님 안녕하세요, 12월 둘째 주 바디프로필 가능할까요?<\/div><div class=\"bub me\">네 가능해요! 토요일 오후 2시 어떠세요? <span class='s'>(이름 · 번호는 이렇게 가려서)<\/span><\/div><\/div>"}, {"id": "B4", "t": "다음 대회 때 현장에 따라가 보기 · 명단과 순서표는 미리", "why": "대회 날 메모리 카드를 언제 · 누가 컴퓨터로 옮기는지, 현장 판매대(사진 파는 자리)가 어떻게 돌아가는지 눈으로 봐야 해요. 명단 · 순서표를 미리 받으면 대회 날 허브를 실제로 돌려 볼 수 있어요.", "tip": "", "br": [{"a": "오세요", "n": "날짜 · 무엇을 볼지", "c": "대회 날 현장에서 시험할 계획 세우기", "s": "무대 위 '지금 누구' 판(지금 무대에 선 선수 번호를 보여 주는 판 · 화면) 같은 새 아이디어도 그날 작게 시험"}, {"a": "현장은 어려워요", "n": "현장 사진 · 영상으로라도 보여 주실 수 있는지", "c": "", "s": ""}], "fig": ""}, {"id": "B5", "t": "스튜디오 컴퓨터에 시험판을 깔아 봐도 되는지 · 언제", "why": "진짜 환경(디스크 · 프로그램 · 와이파이)에서 돌려야 숨은 문제가 보여요. 예를 들어 스튜디오 와이파이가 느리거나 디스크 글자가 자주 바뀌는 문제는 직접 깔아 봐야 알 수 있어요.", "tip": "\"원본은 지우지 않고, 옮기기만 해요. 언제든 끌 수 있어요.\"", "br": [{"a": "돼요", "n": "언제 깔지 · 그 PC를 누가 쓰는지", "c": "설치 날짜 잡기", "s": "처음엔 '보기만' 모드로 — 사진을 읽기만 하고 아무것도 옮기거나 바꾸지 않게"}, {"a": "아직이요", "n": "무엇이 걱정되시는지", "c": "경일 노트북으로 시연만", "s": ""}], "fig": "<div class=\"cap\">지금 만든 허브 현황판 (가짜 자료로 찍은 화면)<\/div>\n<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwMDAgQDAwMEBAQFBgoGBgUFBgwICQcKDgwPDg4MDQ0PERYTDxAVEQ0NExoTFRcYGRkZDxIbHRsYHRYYGRj/2wBDAQQEBAYFBgsGBgsYEA0QGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBj/wgARCAPUBpADASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAEEAgMFBgcI/8QAGQEBAAMBAQAAAAAAAAAAAAAAAAECAwQF/9oADAMBAAIQAxAAAAH50QImBEwImBAQCAQQImBEwInEQEECAiM7BUizJUi4KcXYKcXRRXRRXoKK9BRXhQXhQjoQUI6A58dAc+OjBz46I50dEc6OiOa6UHNdIcx0hzI6kHMjqDlx1YOXHVg5cdWDluoOW6g5bqDluoOW6g5bpjmOmOY6Y5jpjmukOc6Q5s9GDnuiOe6AoL8nPm+KE3hRXhSXRTXJKU3BTXBUW5Ka4Ki2Ki2Kq0Kq2Kk2hVWhVWhVWhVWhVWhVWhVWhUWxUW4Kq0Ki2Ki2Ka5BUi4Ka4KS7BTi6KS6KK9BRXhRi+KEXxQXxz3QgoR0Bz46MHPdAc50RznRg57oDnugOe6A57oCgvigvigv4lJngetvUPXH2S/0PJFP4L+ufyMQ73QPIPsflzwke9rHi30DafOI+g/PhEwICImCARCBCC1Sshn1LR5bHq8oRl6I827+88y7tQ5sAAiYAIABAETAAiYAIABAETAAiYAIAAAAAAAAAAAmBIAJRIAmBIAJRIABKJAAJQJRIAAAmBKBKBKBKBKBMAAA3L5XXNRobcjQtQVW7MrLEGhZxK7dJoWINEbsiu3yV1jE0to1N4rt+JqbRqjdBqWLJzKnarHM \/svg>"}, {"id": "Q1", "t": "촬영자들은 사진을 어떻게 넘기나요? 집에서 올리면 JPEG만도 될까요?", "why": "사진이 허브로 들어오는 길('받기' 입구)을 정해요. JPEG는 RAW보다 파일이 훨씬 작아서 JPEG만 먼저 받으면 용량이 확 줄고, RAW는 팔린 사진만 나중에 받으면 돼요 — 이건 대표님이 정할 일이에요.", "tip": "", "br": [{"a": "메모리 카드를 모아요", "n": "누가 언제 메모리 카드를 모으는지", "c": "지금 만든 '받기' 그대로", "s": ""}, {"a": "각자 집에서 보내요", "n": "어디로(드라이브 등)", "c": "클라우드(드라이브)로 들어오는 입구 만들기", "s": "JPEG만 먼저, RAW는 팔린 것만"}, {"a": "RAW+JPEG 둘 다 와요", "n": "", "c": "", "s": ""}], "fig": ""}, {"id": "Q2", "t": "선수별로 어떻게 찾고 고르나요? 별점 · 색은 무슨 뜻? 직원이 먼저 고르나요?", "why": "허브가 별점을 대표님 뜻대로 써야 라이트룸에서 헷갈리지 않아요. 예를 들어 대표님 스튜디오에서 ★3이 '후보'인데 허브가 ★3을 '납품할 것'으로 쓰면 둘이 뒤섞여요.", "tip": "아래 '그림 · 예시 보기' 표의 오른쪽 칸을 채우기.", "br": [{"a": "별점 뜻이 정해져 있어요", "n": "그 뜻을 표에 채우기", "c": "허브의 기본 설정(기본값)을 대표님 뜻으로 맞춤", "s": ""}, {"a": "그때그때 달라요", "n": "", "c": "허브는 별점을 건드리지 않게 함", "s": ""}, {"a": "직원이 먼저 골라요", "n": "직원 셀렉과 대표님 셀렉을 따로 보는지", "c": "직원이 고른 것을 따로 적는 칸을 만듦", "s": ""}], "fig": "<div class=\"tw\"><table><tr><th>별점·색<\/th><th>대표님 스튜디오에서 뜻 (예시 — 실제로 물어 채우기)<\/th><\/tr><tr><td>★1<\/td><td>버림<\/td><\/tr><tr><td>★3<\/td><td>후보<\/td><\/tr><tr><td>★5<\/td><td>납품<\/td><\/tr><tr><td>빨강<\/td><td>보정 필요?<\/td><\/tr><tr><td>초록<\/td><td>손님이 고름?<\/td><\/tr><\/table><\/div>"}, {"id": "Q3", "t": "다른 선수도 크게 나온 단체 사진은 누구에게 줘요?", "why": "한 사진에 두 선수가 크게 나오면 누구에게 줄지 규칙이 필요해요. 예를 들어 137번 선수 사진에 52번 선수도 크게 같이 나오면, 52번에게도 줄지 정해야 해요.", "tip": "", "br": [{"a": "둘 다에게 줘요", "n": "", "c": "두 선수 폴더에 다 넣음", "s": ""}, {"a": "주인공에게만", "n": "주인공은 어떻게 정하는지(가운데 · 크기)", "c": "주인공 폴더에만 넣음", "s": ""}, {"a": "안 줘요", "n": "", "c": "단체 사진은 따로 묶음", "s": ""}], "fig": "<div class=\"cap\">다른 선수가 크게 나온 사진 (그림 예)<\/div>\n<svg viewBox=\"0 0 320 120\" class=\"svg\"><rect x=\"6\" y=\"6\" width=\"308\" height=\"108\" rx=\"8\" fill=\"var(--soft)\"/>\n<circle cx=\"110\" cy=\"40\" r=\"16\" class=\"pp\"/><rect x=\"92\" y=\"58\" width=\"36\" height=\"46\" rx=\"8\" class=\"pp\"/><text x=\"110\" y=\"86\" class=\"t c w\">137<\/text>\n<circle cx=\"200\" cy=\"44\" r=\"13\" class=\"pp2\"/><rect x=\"186\" y=\"58\" width=\"28\" height=\"40\" rx=\"7\" class=\"pp2\"/><text x=\"200\" y=\"82\" class=\"t c w\">52<\/text>\n<text x=\"110\" y=\"18\" class=\"t c s\">주인공?<\/text><text x=\"200\" y=\"22\" class=\"t c s\">같이 크게<\/text><\/svg>"}, {"id": "Q4", "t": "보정은 누가 하고, 손님 수정 요청은 어떻게 받나요?", "why": "사진 위에 메모 · 펜으로 표시하고 보정을 지시하는 기능(아직 안 만듦 — 다음에 정할 것)을 얼마나 크게 만들지가 여기서 정해져요.", "tip": "", "br": [{"a": "대표님이 다 해요", "n": "", "c": "사진 메모 기능은 가볍게만", "s": ""}, {"a": "외주에 맡겨요", "n": "외주 업체에 보정 지시를 어떻게 전하는지(카톡 · 메일 · 그림)", "c": "보정 지시서 기능이 중요해짐", "s": "사진 위에 표시 + 번호 붙은 지시 + '처리함' 체크"}, {"a": "수정은 카톡으로 와요", "n": "수정을 몇 번까지 해 주는지", "c": "", "s": "카톡으로 온 수정 요청을 사진마다 보정 지시서로 바꿔 주기"}], "fig": ""}, {"id": "Q5", "t": "대회 뒤 사진 사겠다는 연락은 하루 몇 건, 찾는 데 몇 분 걸려요? 어떻게 파세요?", "why": "판매 쪽 기능을 얼마나 크게 만들지 정해요. 가격 이야기는 오늘 약속하지 않기.", "tip": "", "br": [{"a": "하루 0~2건", "n": "", "c": "지금 '번호로 꺼내기'로 충분", "s": ""}, {"a": "많아요", "n": "한 건 찾는 데 시간이 얼마나 드는지", "c": "바로 답해 주는 기능(즉답)을 앞당김", "s": "번호만 넣으면 미리보기 묶음 + 답장 초안"}, {"a": "묶음으로 팔아요", "n": "묶음을 어떻게 나누는지(몇 장 · 어떤 사진끼리)", "c": "", "s": ""}], "fig": ""}, {"id": "Q6", "t": "주최 측과는 어떤 약속이 있어요? 선수 연락처를 받는지, 스튜디오가 따로 팔아도 되는지", "why": "스튜디오가 선수에게 직접 알리거나 팔 수 있는지가 갈려요. 예를 들어 주최 측과 독점 계약이 되어 있으면, 스튜디오가 따로 사진을 팔거나 선수에게 연락하는 게 막혀 있을 수 있어요.", "tip": "", "br": [{"a": "독점 계약이에요", "n": "계약 기간이 언제까지인지", "c": "", "s": ""}, {"a": "주최 측 쇼핑몰로만", "n": "스튜디오 페이지를 따로 열어도 되는지", "c": "판매 기능은 뒤로", "s": ""}, {"a": "연락처를 받아요", "n": "광고 · 알림을 보내도 된다는 동의(수신 동의)를 받았는지", "c": "선수에게 알림 보내는 기능을 만들 수 있음", "s": ""}], "fig": ""}, {"id": "Q7", "t": "문의는 어디로 가장 많이 오고 누가 답하나요? 예약은 어디에?", "why": "상담 비서(문의를 읽고 답장 초안을 써 두는 허브 기능)를 어디에 붙일지, 예약 기록을 허브로 어떻게 옮겨 올지 정해요.", "tip": "", "br": [{"a": "톡채널", "n": "하루 몇 건", "c": "톡채널 쪽을 먼저 만듦", "s": ""}, {"a": "네이버 예약", "n": "", "c": "허브가 네이버 예약을 읽어 오게 함", "s": ""}, {"a": "전화가 많아요", "n": "", "c": "통화한 내용을 메모로 남기는 기능", "s": ""}], "fig": ""}, {"id": "Q8", "t": "직원이 한 명 더 있다면 무슨 일을? AI에게 맡기기 싫은 일은?", "why": "AI 직원 기능을 무엇부터 만들지, 그리고 어디까지만 맡길지(이 선을 넘는 일은 AI가 하지 않음)를 정해요.", "tip": "", "br": [{"a": "상담 · 예약 정리", "n": "", "c": "상담 비서를 먼저 만듦", "s": ""}, {"a": "사진 정리 · 셀렉", "n": "", "c": "밤샘 처리를 먼저 만듦", "s": ""}, {"a": "손님에게 직접 답하는 건 싫어요", "n": "", "c": "AI는 초안만, 보내기는 사람", "s": "지금도 그렇게(AI는 초안만) 만들고 있다고 말씀드리기"}], "fig": ""}], "later": {"C": "외부 작가 카메라가 섞이는지 · 메모리 카드 한 장에 두 행사를 찍는지 · 모니터 두 대로 상담하는지", "B": "바디프로필 촬영 1건 전체(손님 허락 받은 것) · 보정한 납품본 몇 장 · 2주 동안 일마다 걸린 시간 간단히", "Q": "사진 보관 기간 · 지우는 때 · 사진을 잃은 적 · 밖에서 폰으로 보고 싶은 것 · 사진에 메모나 펜 표시를 하는지"}}</script>

var GLOSS = [["허브", "우리가 만들고 있는 프로그램이에요. 스튜디오 컴퓨터에서 돌면서 사진 받기 · 정리 · 선수별로 나누기 · 납품을 도와줘요. 예를 들어 대회 때 찍은 메모리 카드를 꽂으면 사진을 옮기고 선수별 폴더까지 만들어 두는 식이에요."], ["현황판", "허브를 켜면 보이는 첫 화면이에요. 오늘 할 일 · 일정 · 진행 상황을 한눈에 보여 줘요."], ["원본", "카메라가 찍은 그대로의 사진 파일이에요. 보정하거나 이름을 바꾸기 전 것."], ["RAW", "카메라가 찍은 그대로 저장하는 큰 사진 파일 종류예요(.CR3 · .NEF · .ARW 등). 보정할 여유가 커요."], ["JPEG", "흔히 쓰는 사진 파일(.jpg)이에요. 작고 어디서나 바로 열려요."], ["셀렉", "많은 사진 가운데 쓸 사진을 고르는 일이에요. 예를 들어 연사로 비슷하게 찍힌 10장 중 가장 잘 나온 1장을 남기는 것."], ["1차 셀렉", "사람이 보기 전에 허브가 먼저 후보를 골라 두는 것이에요. 흔들린 사진 · 눈 감은 사진 같은 것을 먼저 걸러 두고, 마지막은 사람이 고쳐요."], ["정답지", "대표님이 실제로 고른 사진 목록이에요. 허브가 맞게 골랐는지 견주는 기준이 돼요. 예를 들어 대표님이 고른 200장 중 허브도 180장을 골랐다면 많이 맞힌 거예요."], ["라이트룸", "어도비의 사진 고르기 · 보정 프로그램이에요. 'Classic'은 컴퓨터에 깔아 쓰는 판."], ["카탈로그", "라이트룸이 별점 · 보정 기록을 모아 두는 파일(.lrcat)이에요. 사진 자체는 안 들어 있고 '어느 사진에 별 몇 개 · 어떤 보정'만 적혀 있어요. 이걸 받으면 대표님이 무엇을 골랐는지 알 수 있어요."], [".lrcat", "라이트룸 카탈로그 파일의 끝 이름이에요."], ["캡처원", "사진 고르기 · 보정 프로그램(Capture One)이에요. 라이트룸과 비슷해요."], ["포토 메카닉", "사진을 아주 빨리 훑어 고르는 프로그램(Photo Mechanic)이에요."], ["프리셋", "보정 값을 묶어 저장한 것이에요. 누르면 여러 사진에 같은 느낌이 한 번에 입혀져요. 예를 들어 '무대 조명용' 프리셋 하나로 대회 사진 전체의 색을 맞추는 식."], ["별점", "라이트룸에서 사진에 붙이는 ★1~5 표시예요. 스튜디오마다 뜻이 달라요. 예를 들어 어떤 곳은 ★3이 '후보', ★5가 '납품'이에요."], ["색 라벨", "라이트룸에서 사진에 붙이는 색 표시(빨강 · 초록 등)예요."], ["테더링", "카메라를 선으로 컴퓨터에 이어서, 찍자마자 컴퓨터로 사진이 들어오게 하는 방법이에요. 스튜디오 촬영에서 손님이 모니터로 바로 보며 고를 때 많이 써요."], ["메모리 카드", "카메라 안에 꽂는 작은 저장 칩(SD · CF 등)이에요. 찍은 사진이 여기에 먼저 담겨요."], ["외장 디스크", "USB로 꽂는 저장 장치예요(외장 하드 · 외장 SSD)."], ["SSD", "빠른 저장 장치예요. 외장 SSD는 USB로 꽂는 것."], ["NAS", "스튜디오 안 인터넷 공유기에 연결해 여러 컴퓨터가 같이 쓰는 저장 상자예요. 예를 들어 사무실 컴퓨터와 보정 컴퓨터가 같은 사진 폴더를 함께 여는 식."], ["클라우드", "구글 드라이브 · 네이버 MYBOX처럼 인터넷 너머에 파일을 두는 곳이에요."], ["드라이브", "여기서는 구글 드라이브 같은 인터넷 저장 공간을 말해요."], ["백업", "같은 파일을 다른 곳에도 복사해 두는 것이에요. 한 곳이 망가져도 남게. 예를 들어 메모리 카드의 사진을 외장 디스크와 NAS 두 곳에 복사해 두기."], ["TB", "저장 용량 단위예요. 1TB = 1,000GB. 사진 3만 장이 1TB쯤 될 수 있어요."], ["본체 번호", "카메라마다 다른 고유 번호(시리얼 번호)예요. 사진 파일 안에 적혀 있어서 '어느 카메라로 찍었는지' 가를 수 있어요. 예를 들어 같은 기종 두 대라도 번호가 다르면 A캠 · B캠으로 나눠져요."], ["저작권 정보", "카메라 메뉴에 작가 이름을 넣어 두면, 찍는 사진마다 그 이름이 파일 안에 적혀요."], ["기종", "카메라 모델 이름이에요(예: 소니 a7 IV)."], ["시계", "카메라 안 시계예요. 카메라끼리 몇 분씩 어긋나면 사진 시각으로 순서를 맞추기 어려워요. 예를 들어 한 대가 5분 늦으면 그 카메라 사진만 다음 체급 쪽에 섞여요."], ["순서표", "대회 날 어느 시간에 어느 종목 · 체급이 무대에 오르는지 적은 표예요. 예를 들어 '10:00 남자 보디 -75kg'. 허브는 사진 찍힌 시각을 이 표와 맞춰요."], ["선수 명단", "선수 번호 · 이름 · 종목 · 체급을 적은 목록이에요."], ["체급", "몸무게 등으로 나눈 대회 부문이에요."], ["종목", "대회에서 나누는 경기 갈래예요(예: 남자 보디 · 클래식)."], ["사전 구매", "대회 전에 사진을 미리 산 사람이에요. 이 사람들 사진은 대회가 끝나면 먼저 챙겨 보내야 해요."], ["사후 구매", "대회가 끝난 뒤 연락해서 사진을 사는 것이에요. 예를 들어 '137번인데 제 사진 있나요?' 하는 문의."], ["번호로 꺼내기", "선수 번호만 넣으면 허브가 그 선수 사진을 모아 보낼 폴더를 만들어 주는 기능이에요(이미 있음)."], ["납품", "손님에게 줄 사진을 골라 폴더에 담아 보내는 일이에요. 허브에서는 '꺼내기'라고도 해요. 예를 들어 보정한 JPEG 20장을 링크로 보내기."], ["지울 것", "오래된 원본을 바로 지우지 않고 '지울 것' 폴더로 옮겨 두는 허브 기능이에요. 언제든 되돌릴 수 있어요."], ["동의서", "사진 찍기 · 판매 · 얼굴로 찾기 등을 허락받는 서류예요. 예를 들어 대회 신청서에 '사진 촬영 · 판매에 동의합니다' 칸이 있는 것."], ["얼굴로 찾기", "사진 속 얼굴을 비교해 같은 사람 사진을 찾는 기능이에요. 동의를 받은 사람에게만 써야 해요."], ["개인정보", "이름 · 전화번호 · 얼굴처럼 사람을 알아볼 수 있는 정보예요."], ["바깥 AI", "인터넷 너머 회사 서버(클라우드)에서 도는 AI예요. 사진을 그쪽으로 보내야 해서 허락이 따로 필요해요. 허브는 기본으로 스튜디오 컴퓨터 안에서만 처리해요."], ["시험판", "아직 다듬는 중인 허브를 써 보게 까는 판이에요. 원본을 지우지 않고, 언제든 끌 수 있게 만들어요."], ["부트캠프", "맥을 껐다 켜서 윈도우로 쓰는 방법이에요."], ["사양", "컴퓨터 성능 정보예요(그래픽 카드 · 메모리 · 저장 공간)."], ["그래픽 카드", "AI 계산을 빠르게 하는 컴퓨터 부품이에요."], ["주최 측", "대회를 여는 단체예요."], ["독점 계약", "그 대회 사진을 한 스튜디오만 찍고 팔 수 있게 한 약속이에요."], ["쇼핑몰", "여기서는 주최 측이 사진 등을 파는 인터넷 가게예요."], ["톡채널", "카카오톡 채널(톡채널) — 가게용 카카오톡 계정이에요. 여러 손님 상담을 한곳에서 받아요."], ["네이버 예약", "네이버에서 손님이 직접 예약하는 기능이에요."], ["답장 초안", "AI가 미리 써 두는 답장이에요. 보내는 건 늘 사람이 해요."], ["장부", "허브가 사진 · 사람 · 일 · 가격을 적어 두는 기록이에요(데이터베이스). 예를 들어 '137번 김하늘 — 사진 5장 구매'가 여기 적혀요."], ["대표님 암호", "대표님만 아는 비밀번호로 돈 · 지울 것 같은 중요 화면을 잠그는 것이에요(아직 안 만듦)."], ["정산", "돈 계산이에요. 예를 들어 촬영자 수고비 · 대회별 매출 정리."], ["외주", "바깥 사람 · 업체에 일을 맡기는 것이에요. 예를 들어 보정을 바깥 보정 업체에 맡기는 것."], ["보정 지시서", "사진마다 어떻게 보정할지 적은 글 · 그림이에요."], ["디스크 이름표", "외장 디스크마다 붙인 이름이에요(예: 스튜디오SSD-1). 꽂을 때마다 글자(E: · F:)가 바뀌어도 알아보게."], ["폴더 구조", "폴더 안에 폴더가 들어 있는 모양이에요. 메모리 카드에서 옮긴 그대로가 시험에 좋아요."], ["정확도", "허브가 맞힌 비율이에요."], ["밤샘 처리", "퇴근할 때 메모리 카드를 꽂아 두면 허브가 밤새 정리해 두는 것이에요(구상 중)."], ["확인 요청", "허브가 사람에게 '이거 맞나요?' 하고 묻는 목록이에요. 예를 들어 참가번호가 가려져서 누구인지 모르는 사진을 모아 사람에게 물어요."], ["프로젝트", "한 건의 일(대회 하나 · 촬영 한 건)을 묶는 허브 단위예요. 예를 들어 '2026 봄대회'가 프로젝트 하나."], ["가린 캡처", "이름 · 전화번호를 가린 화면 사진이에요."], ["선수 찾기", "사진 속 참가번호 · 찍힌 시각 · 카메라를 보고 어느 선수 사진인지 허브가 가려 주는 기능이에요. 예를 들어 대회 사진 전체를 넣으면 '137번 김하늘' 폴더처럼 선수별로 묶어 줘요."], ["연사", "셔터를 누르고 있는 동안 여러 장을 이어 찍는 것이에요. 예를 들어 포즈 한 번에 비슷한 사진이 여러 장 생겨서, 그중 잘 나온 것을 골라야 해요."], ["참가번호", "대회 때 선수가 선수가 단 번호표의 번호예요. 사진에 이 번호가 보이면 허브가 누구 사진인지 알아내요."], ["본식", "결혼식 본 예식을 찍는 촬영이에요. 여기서는 앞서 허브를 시험해 본 결혼식 사진 묶음을 말해요."], ["보정본", "원본을 보정(밝기 · 색 · 피부 등)해서 새로 저장한 사진이에요. 보통 손님에게 납품하는 JPEG 파일이에요."], ["시연", "실제로 돌려 보이면서 보여 드리는 것이에요. 예를 들어 경일 노트북에서 허브를 켜 대표님께 보여 드리기."], ["경로", "파일이 있는 자리의 주소예요. 예를 들어 NAS 안 '사진 › 2026_봄대회' 폴더를 컴퓨터는 \\\\NAS\\사진\\2026_봄대회 처럼 적어요."], ["상담 비서", "손님 문의(카톡 · 인스타 등)를 읽고 답장 초안을 써 두는 허브 기능이에요. 보내기는 늘 사람이 눌러요."], ["AI 직원", "허브 안에서 사진 정리 · 답장 초안처럼 되풀이되는 일을 맡는 AI 기능들을 묶어 부르는 말이에요. 상담 비서 · 밤샘 처리가 여기 들어가요."], ["처음 본 카메라", "허브가 아직 모르는 카메라로 찍은 사진이 들어오면 '이 카메라는 누구 건가요?' 하고 사람에게 묻는 것이에요. 외부 작가가 자주 오면 이 물음이 자주 떠요."], ["외부 작가", "스튜디오 직원이 아니라 대회 날 등 그때그때 불러서 함께 찍는 바깥 사진가예요."], ["미리보기 묶음", "손님이 고르기 쉽게 사진을 작게 줄여 한데 모은 것이에요. 예를 들어 선수에게 '이 중에서 사실 사진을 골라 주세요' 하고 보내는 것."], ["체급 구간", "순서표 시간에 맞춰 사진을 체급별로 나눈 덩어리예요. 예를 들어 10:00~10:40에 찍힌 사진은 '남자 보디 -75kg'으로 묶어요."], ["개발 기록", "허브를 만들면서 날마다 무엇을 했는지 적고 화면 사진을 붙여 두는 기록이에요(개발 일지). 진짜 화면을 실으면 손님 얼굴 · 이름이 보일 수 있어서 허락이 필요해요."], ["개발 일지", "허브를 만들면서 날마다 무엇을 했는지 적고 화면 사진을 붙여 두는 기록이에요. 진짜 화면을 실으면 손님 얼굴 · 이름이 보일 수 있어서 허락이 필요해요."], ["개발 규칙", "허브를 만들면서 경일과 AI가 미리 정해 둔 약속이에요. 예를 들어 '원본은 지우지 않는다' · '사진은 바깥으로 안 보낸다'. 대표님 허락이 이것보다 먼저예요."], ["가짜 사진", "시험용으로 우리가 만든 사진이에요. 진짜 손님 정보가 없어서 마음 놓고 쓸 수 있지만, 진짜 대회만큼 정확히 재기는 어려워요."], ["가짜 자료", "시험용으로 우리가 만든 사진 · 명단 · 대화예요. 진짜 손님 정보가 없어서 마음 놓고 쓸 수 있지만, 진짜 대회만큼 정확히 재기는 어려워요."], ["대화 내보내기", "카톡 대화를 글 파일로 저장해 빼내는 기능이에요. 화면을 하나하나 캡처하는 것보다 빠르지만, 이름 · 번호가 그대로 들어 있어요."], ["판매대", "대회 : "예시 — 사진 한 장(IMG_0412)에 쌓이는 여섯 줄(가짜 값)", "howto": "왼쪽 숫자 = 쌓이는 순서 · 오른쪽 파란 표시 = 그 줄을 적는 단계", "max_w": 720, "src_wh": [1440, 1624]}, {"type": "p", "text": "1~2번은 사진 파일 안에 저절로 적힌 카메라 정보와 담당표에서 나온다. 3~4번은 허브가 판단하고, 애매하면 사람에게 묻는다. 5~6번은 실제로 파일이 움직인 기록이다."}, {"type": "note", "text": "가짜 값이다. 카메라 번호 · 선수 이름 · 점수는 이해를 돕기 위해 지어 넣었다."}], "terms": [{"w": "본체 번호", "d": "카메라마다 하나뿐인 일련번호. 사진 파일 안에 저절로 적힌다"}, {"w": "점수", "d": "허브가 매긴 사진 점수. 1에 가까울수록 좋다고 본 것"}], "talk": "예를 들면 사진 한 장에 이렇게 쌓여요. 어느 카메라에서 왔는지, 그 카메라를 그 시간에 누가 들고 있었는지, 몇 번 선수인지, 골랐는지, 어디로 꺼냈는지, 이제 옮겨도 되는지. 이게 다 한 장부에 있으니까 나중에 지워도 되냐는 질문에 허브가 근거를 댈 수 있어요.", "sources": "loop 슬라이드 ‘사진 한 장이 지나가는 길’을 풀어 그림으로. 값은 가짜(이 설명을 위해 지음).", "status": null}, {"id": "legend", "section": "s1", "kicker": "화면 보는 법", "title": "노란빛은 사람 차례, 파란빛은 허브 차례", "lead": "허브 화면에서 노란빛은 사람 차례, 파란빛은 허브가 하는 중이다. 설명 화면 위에는 만든 정도를 표시했다.", "flow": {"prev": "사진 한 장의 기록", "cur": "화면 보는 법", "next": "현황판"}, "blocks": [{"type": "img", "src": "explain/img/fig_legend.webp", "alt": "텅스텐·데이라이트 두 색과 만들고 시험함·만드는 중·구상 세 표시", "caption": "색과 표시의 뜻", "howto": "노란 네모 = 사람 차례 · 파란 네모 = 허브가 하는 중 · 아래 알약 = 만든 정도", "max_w": 720, "src_wh": [1440, 1042]}, {"type": "img", "src": "explain/img/legend_app.webp", "alt": "실제 현황판 — 파란 허브 브리핑 줄과 노란 아이콘의 확인 요청 목록", "caption": "실제 현황판에서 두 색이 쓰이는 모습", "howto": "파란 줄 = 허브 브리핑(허브가 알리는 것) · 노란 아이콘 = 사람이 답할 확인 요청", "src_m": "explain/img/legend_app_m.webp", "max_w": 1330, "src_wh": [1330, 650], "src_m_wh": [1200, 1300]}, {"type": "p", "text": "색 이름은 조명에서 따왔다. **텅스텐**(노란빛)은 답하거나 정할 것이 기다리는 자리, **데이라이트**(파란빛)는 허브가 하는 중이라 지켜보는 자리다."}, {"type": "note", "text": "지금까지 시험은 모두 가짜 사진과 시험용 사진으로 했다. 진짜 대회 사진으로는 아직 돌려 보지 않았다."}], "terms": [{"w": "텅스텐", "d": "노란빛 조명. 화면에서는 ‘사람 차례’"}, {"w": "데이라이트", "d": "파란빛 조명. 화면에서는 ‘허브가 하는 중’"}, {"w": "만들고 시험함", "d": "만들어서 자동 시험까지 한 것(가짜 자료)"}, {"w": "구상", "d": "그림(시안)만 있고 아직 안 만든 것"}], "talk": "화면 색은 두 가지 뜻이에요. 노란빛, 텅스텐 색이 보이면 사람이 답할 차례고, 파란빛, 데이라이트 색이면 허브가 알아서 하고 있는 거예요. 조명 이름으로 맞춰 봤어요. 그리고 화면마다 위에 만든 정도를 적어 놨어요. 시험은 다 가짜 사진으로만 한 거예요.", "sources": "색 = docs\\DESIGN.md 1절 2번. 상태 = docs\\기능목록.md 상태 표시. 화면 = legend_app(가짜 자료).", "status": null}, {"id": "board", "section": "s2", "kicker": "현황판", "title": "켜자마자 오늘 상황이 한눈에", "lead": "예약은 달력에, 사진은 폴더에, 할 일은 머릿속에 흩어져 있던 것을 허브를 켜면 처음 보는 한 화면에 모은다.", "status": "built", "flow": {"prev": "장부", "cur": "현황판", "next": "답하기"}, "blocks": [{"type": "img", "src": "explain/img/dash_v3.webp", "alt": "현황판 화면 — 허브 브리핑 한 줄, 확인 요청 7건, 수신 144컷, 오늘 일정, 프로젝트 목록", "caption": "현황판(평소 짜임)", "howto": "맨 위 파란 줄 = 오늘 한 줄 요약 · 왼쪽 = 답할 것 · 가운데 = 들어오는 사진(밑 숫자는 사진 번호)과 오늘 일정 · 오른쪽 = 진행 중인 일", "src_m": "explain/img/dash_v3_m.webp", "max_w": 1280, "src_wh": [1280, 800], "src_m_wh": [920, 840]}, {"type": "p", "text": "위쪽 단추로 **평소 · 촬영 날 · 대회 날 · 납품 날** 짜임을 바꾼다. 그날 일에 맞게 칸 배치가 달라진다. 칸은 끌어서 옮기고, 서랍에서 꺼내 더할 수 있다."}, {"type": "cards", "items": [{"title": "촬영 날", "text": "오늘 일정이 시간표로 크게", "img": "explain/img/dash_shootday_c.webp", "tag": "짜임", "img_wh": [1240, 450]}, {"title": "대회 날", "text": "대회 진행과 들어오는 사진을 한 화면에", "img": "explain/img/dash_contestday_c.webp", "tag": "짜임", "img_wh": [1240, 430]}]}], "terms": [{"w": "허브 브리핑", "d": "맨 위 파란 줄. 허브가 오늘 상황을 한 줄로 알린다"}, {"w": "짜임", "d": "현황판 칸 배치. 날마다 바꿔 쓴다"}, {"w": "확인 요청", "d": "사람이 답해야 할 것만 모인 목록"}], "talk": "허브 켜면 처음 나오는 화면이에요. 맨 위에 오늘 상황 한 줄, 왼쪽은 답할 것, 가운데는 들어오는 사진이랑 오늘 일정, 오른쪽은 진행 중인 일이에요. 위에 평소, 촬영 날, 대회 날, 납품 날 단추를 누르면 그날에 맞게 칸이 바뀌고, 칸은 끌어서 옮길 수 있어요.", "sources": "기능목록 1.4 관제실 대시보드 · 1.15 현황판 칸 짜임(만들고 시험함, 작업 1.42). 화면 = 새틀 현황판 v3 · 촬영 날 · 대회 날, 가짜 자료."}, {"id": "answer", "section": "s2", "kicker": "답하기", "title": "허브가 묻고, 사람은 예 · 아니오 · 모르겠음", "lead": "허브는 혼자 정하기 애매한 것만 묻는다. 답은 예 · 아니오 · 모르겠음 세 가지다.", "status": "built", "flow": {"prev": "현황판", "cur": "답하기", "next": "받기"}, "blocks": [{"type": "img", "src": "explain/img/fig_answer.webp", "alt": "109번이 맞는지 묻는 질문과 예·아니오·모르겠음을 눌렀을 때 생기는 일", "caption": "세 답을 눌렀을 때 생기는 일", "howto": "초록 = 예 · 붉은 = 아니오 · 회색 = 모르겠음(기다림) · 숫자 1·2·3은 키보드로도 답할 수 있다는 뜻", "max_w": 720, "src_wh": [1440, 928]}, {"type": "img", "src": "explain/img/dash_answer.webp", "alt": "현황판 오른쪽에 열린 답하기 창 — 예, 아니오, 모르겠음 단추", "caption": "PC에서 답하는 창", "howto": "오른쪽 끝에 열린 창에서 단추로 답한다", "src_m": "explain/img/dash_answer_m.webp", "max_w": 1680, "src_wh": [1680, 980], "src_m_wh": [920, 1800]}, {"type": "img", "src": "explain/img/mobile.webp", "alt": "휴대폰 화면의 현황판 — 허브 브리핑과 확인 요청 목록, 아래 탭 막대", "caption": "같은 화면을 휴대폰으로", "howto": "아래 탭 막대의 ‘확인 요청’에서 똑같이 답한다", "max_w": 390, "src_wh": [390, 844]}, {"type": "p", "text": "묻는 것의 예: “이 가예약을 확정으로 바꿀까요?” · “다 올리셨나요?” · “이 사람이 109번이 맞나요?” **모르겠음**을 누르면 허브는 억지로 붙이지 않고 그대로 기다린다."}], "terms": [{"w": "가예약", "d": "날짜만 잡아 두고 아직 확정 안 된 예약"}, {"w": "확인 요청", "d": "사람이 답해야 할 것만 모인 목록"}], "talk": "허브 쓰면서 사람이 하는 일은 대부분 이거예요. 허브가 애매한 것만 물어보고, 예, 아니오, 모르겠음 중에 골라요. 키보드 1, 2, 3으로도 되고 휴대폰에서도 똑같아요. 모르겠음이 중요한데, 누르면 억지로 붙이지 않고 기다려요. 틀린 선수한테 사진 가는 것보다 그게 낫다고 봤어요.", "sources": "기능목록 1.5 확인함 · 1.10 모바일 화면(만들고 시험함). DESIGN.md 1절 7번. 화면 = 새틀 답하는 창 1680 · 현황판 v3 390, 가짜 자료."}, {"id": "receive", "section": "s2", "kicker": "① 받기", "title": "사진을 폴더에 넣으면, 허브가 받아서 센다", "lead": "‘지켜볼 폴더’(사진을 넣어 두면 허브가 알아서 가져가는 폴더)에 사진을 넣으면 허브가 저절로 받아, 촬영자별 장수와 빠진 파일 번호, 겹친 사진을 센다.", "status": "built", "flow": {"prev": "촬영", "cur": "받기", "next": "받기 과정"}, "blocks": [{"type": "img", "src": "explain/img/contest_receive.webp", "alt": "대회 화면 — 촬영자별 묶음 48장, 빠진 번호 2개씩, 다 올렸어요 단추, 카메라 시계 맞추기", "caption": "대회 화면의 받기 칸", "howto": "shooter_1~3 = 촬영자 1~3 · 노란 칸 ‘빠진 번호’ = 중간에 빠진 파일 번호 · 오른쪽 ‘카메라 시계’ = 카메라마다 몇 초 어긋났는지", "src_m": "explain/img/contest_receive_m.webp", "max_w": 1270, "src_wh": [1270, 910], "src_m_wh": [890, 950]}, {"type": "compare", "left": {"title": "지금", "items": ["메모리 카드마다 옮기고 다 왔는지 눈으로 확인", "빠진 파일은 나중에 찾다가 알게 됨"]}, "right": {"title": "허브", "items": ["지켜볼 폴더에 넣으면 저절로 받음", "촬영자별 장수 · 빠진 번호 · 겹친 사진을 셈", "원본은 읽기만 하고 고치지 않음"]}}, {"type": "note", "text": "60초 · 30분 · 2시간은 처음 값이고 설정에서 바꿀 수 있다. 촬영자가 각자 클라우드 폴더에 올리면 모아 오는 길은 아직 구상이다."}], "terms": [{"w": "메모리 카드", "d": "카메라에 꽂는 작은 저장 칩(SD 카드 등). 찍은 사진이 여기에 먼저 담긴다"}, {"w": "지켜볼 폴더", "d": "사진을 넣어 두면 허브가 알아서 가져가는 폴더"}, {"w": "빠진 번호", "d": "파일 번호가 중간에 비어 있는 곳. 덜 옮겨졌을 수 있다는 신호"}], "talk": "첫 고리는 받기예요. 지금은 메모리 카드마다 옮기고 다 왔는지 눈으로 보잖아요. 허브는 지켜볼 폴더를 정해 두면 거기 들어온 걸 알아서 받아요. 받으면서 촬영자별로 몇 장인지, 번호가 빠진 데 없는지, 같은 사진이 두 번 들어오진 않았는지 세요. 화면에 노란 칸이 빠진 번호예요.", "sources": "기능목록 5.1 · 5.17 · 5.18 · 5.19(만들고 시험함) · 5.15 클라우드 폴더(구상). 처음 값 30분 · 120분 · 60초 = 설정 화면 캡처. 화면 = 작업 1.42 contest 1680px, 가짜 대회."}, {"id": "receive-how", "kicker": "① 받기 · 과정", "title": "받기는 이렇게 돈다 — 복사까지만 사람 손", "lead": "처음 한 번 폴더를 정해 두면, 평소에는 메모리 카드 내용을 복사하는 것까지만 사람이 한다. 세고 묻고 넘어가는 것은 허브가 한다.", "flow": {"prev": "받기", "cur": "받기 과정", "next": "카메라 · 담당"}, "terms": [{"w": "메모리 카드", "d": "카메라에 꽂는 작은 저장 칩(SD 카드 등). 찍은 사진이 여기에 먼저 담긴다"}, {"w": "순서표", "d": "종목별 무대 순서와 시간. 사진을 체급 구간으로 나눌 때 쓴다"}, {"w": "자동 완료", "d": "물어본 뒤 정해 둔 시간 동안 답이 없으면 다 받은 것으로 보는 것"}], "talk": "받기가 실제로 어떻게 도냐면요. 처음에 사진 넣을 폴더만 정해 두면, 평소엔 메모리 카드 내용을 거기로 복사하는 것까지가 사람 일이에요. 허브가 1분마다 들여다보면서 세고, 30분 조용하면 촬영자한테 다 올렸냐고 묻고, 2시간 답이 없으면 다 받은 걸로 보고 선수 찾기로 넘어가요. 시간은 다 설정에서 바꿀 수 있어요.", "sources": "기능목록 5.1 · 5.17 · 5.18(만들고 시험함) · 5.15(구상). 처음 값 = 설정 화면 캡처(조용한 시간 30분 · 자동 완료 120분 · 훑는 간격 60초).", "blocks": [{"type": "img", "src": "explain/img/fig_proc_receive.webp", "alt": "처음 한 번 지켜볼 폴더를 정하고, 평소에는 복사 → 허브가 세기 → 다 올렸는지 묻기 → 다음 일로 이어지는 과정", "caption": "처음 한 번 준비와 평소 한 번 돌 때", "howto": "왼쪽 색 칸 = 누가 하는 일인지(노랑 사람 · 파랑 허브) · 아래 검은 칸 = 사진이 들어오는 길 두 가지", "max_w": 720, "src_wh": [1440, 2226]}, {"type": "steps", "items": [{"t": "처음 한 번 — 지켜볼 폴더 정하기", "d": "설정에서 한 번 정한다. 대회를 만들 때 선수 명단과 순서표(종목별 무대 순서와 시간)를 넣어 둔다.", "img": null}, {"t": "사람 — 메모리 카드 내용을 복사", "d": "메모리 카드에서 옮긴 그대로, 폴더 이름도 바꾸지 않고 지켜볼 폴더로 복사한다.", "img": null}, {"t": "허브 — 살펴 받고 세기", "d": "60초마다 새 사진이 있는지 살핀다. 원본은 읽기만 하고 고치지 않는다.", "img": "explain/img/t_day_receive.webp", "img_wh": [424, 240]}, {"t": "허브 — 새 사진이 끊기면 묻기", "d": "30분 동안 새 사진이 없으면 촬영자에게 “다 올리셨나요?” 하고 묻는다. 2시간 답이 없으면 다 받은 것으로 보고 다음 일로 넘어간다.", "img": "explain/img/settings_c.webp", "img_wh": [1250, 540  계산(추정).", "status": null}, {"id": "ai-ways", "section": "s3", "kicker": "AI 붙이기 ① 구독", "title": "Claude 앱에 말로 시키기 — 월 정액", "lead": "사람이 Claude 앱에 말로 부탁하면, 앱이 허브의 창구(MCP)를 통해 기록을 읽고 답하거나 초안을 남긴다. 사람이 말을 걸 때만 일하고, 값은 월 정액이다.", "status": "idea", "flow": {"prev": "드는 돈", "cur": "AI 붙이기 — 구독", "next": "구독 방식 과정"}, "blocks": [{"type": "img", "src": "explain/img/fig_aisub.webp", "alt": "사람 → Claude 앱 → 허브 창구(MCP) → 확인 요청으로 이어지는 구독 방식", "caption": "구독 방식 한눈에", "howto": "노랑 = 사람 · 흰 칸 = Claude 앱 · 검은 칸 = 허브 창구", "max_w": 720, "src_wh": [1440, 1410]}, {"type": "table", "head": ["연결 길", "어떻게", "지금"], "rows": [["스튜디오 PC 안", "PC의 Claude 데스크톱 앱이 같은 PC의 창구에 붙는다", "개발 시험 방식 · 실제 연결은 안 해 봄"], ["밖에서 휴대폰으로", "창구를 인터넷 주소로 열고 로그인(OAuth)을 붙인다", "아직 없음(구상)"]]}, {"type": "note", "text": "창구에는 지우기 · 결제 · 승인 도구가 아예 없다. 사진 · 얼굴은 보내지 않고 글과 숫자만 오간다. 구독이 없어도 허브는 돈다."}], "terms": [{"w": "MCP(창구)", "d": "AI 앱이 허브에 들어올 때 쓰는 정해진 문. 허브가 허락한 행동만 할 수 있다"}, {"w": "OAuth", "d": "앱이 바깥에서 들어올 때 쓰는 로그인 방식"}, {"w": "Claude 데스크톱 앱", "d": "PC에 까는 Claude 앱"}], "talk": "AI 붙이는 방식이 두 가지인데, 첫째가 구독이에요. Claude 앱에 말로 물어보면 앱이 허브 창구로 들어와서 기록을 읽고 답하거나 초안을 남겨요. 사람이 말 걸 때만 일하고 월 정액이에요. 연결하는 길은 스튜디오 PC 안에서 붙이는 것과 밖에서 휴대폰으로 붙이는 것 두 가지인데, 밖에서 쓰는 건 아직 없어요. 허브 쪽 창구는 만들어서 시험했고, 실제 Claude 앱에 붙여 본 적은 아직 없어요.", "sources": "기능목록 10.1 MCP 창구 · 10.3 승인 대기표 · 10.4 열쇠 · 10.7 ‘누가’ 칸(만들고 시험함) · 10.9 비서 연결(구상). docs\\05_허브MCP_비서_구상 32행(원격 커넥터 · 로컬 데스크톱 앱) · 46행(개발 중 로컬 시험) · 72행(OAuth). 결정 25 · 26(허브의 겉은 MCP 창구 하나 — 02_구조 0절). 구독 값 = claude.com/pricing(2026-11-21)."}, {"id": "ai-ways-how", "kicker": "AI 붙이기 ① 구독 · 과정", "title": "말로 시켜도 승인 전엔 안 움직인다", "lead": "처음 한 번 개발자가 열쇠(비서마다 따로 주는 접속 권한)를 만들고 창구를 등록한다. 평소에는 사람이 말로 부탁하고, 파일이 움직이는 일은 사람이 승인해야 실행된다.", "flow": {"prev": "AI 붙이기 — 구독", "cur": "구독 방식 과정", "next": "AI 붙이기 — API"}, "terms": [{"w": "열쇠", "d": "비서마다 따로 주는 접속 권한. 쓸 수 있는 일이 열쇠마다 다르다"}, {"w": "승인 대기표", "d": "AI가 요청한 일이 사람 도장을 기다리는 줄"}, {"w": "이름표", "d": "누가 시킨 일인지(사람 · 직원 · Claude) 장부에 남는 표시"}], "talk": "Claude 앱으로 시키는 건 이렇게 돌아가요. 처음에 제가 허브에서 비서용 열쇠를 만들어서 할 수 있는 일을 정해 두고, Claude 앱에 허브 창구를 등록해요. 평소엔 앱에 말로 물어보면 Claude가 허브 기록을 읽고 답하거나 초안을 남기고, 파일을 옮기는 일은 요청으로만 남아서 현황판에서 승인해야 허브가 움직여요. 실제 앱에 붙이는 건 아직 안 해 봤어요.", "sources": "기능목록 10.1 · 10.3 · 10.4 · 10.7(만들고 시험함) · 10.9(구상). docs\\05_허브MCP_비서_구상 32 · 46 · 72행.", "blocks": [{"type": "img", "src": "explain/img/fig_proc_mcp.webp", "alt": "처음 한 번 열쇠 만들기와 창구 등록, 평소 부탁 → 기록 읽기 → 초안 → 승인 → 실행, 그리고 두 가지 연결 길", "caption": "처음 준비 · 평소 한 번 · 연결 길 두 가지", "howto": "왼쪽 색 칸 = 누가 하는 일인지 · 점선 칸 = 아직 안 해 본 것 · 아래 검은 칸 = 연결하는 길", "max_w": 720, "src_wh": [1440, 2490]}, {"type": "steps", "items": [{"t": "처음 한 번 — 열쇠 만들기(개발자)", "d": "비서마다 열쇠를 따로 만들고, 열쇠마다 쓸 수 있는 일(읽기 · 초안 · 요청)을 정한다. 만들고 시험함.", "img": null}, {"t": "처음 한 번 — 창구 등록(개발자)", "d": "Claude 앱에 허브 창구 주소와 열쇠를 등록한다. 아직 실제로 붙여 본 적 없다.", "img": null}, {"t": "평소 — 말로 부탁(사람)", "d": "“오늘 대회 진행 어때?” “144번 사진 준비됐어?”", "img": null}, {"t": "평소 — 읽고 답하거나 초안(Claude)", "d": "창구로 허브 기록을 읽는다. 파일을 옮기는 일은 ‘요청’으로만 남긴다.", "img": null}, {"t": "평소 — 승인과 실행(사람 → 허브)", "d": "현황판에서 사람이 승인한 뒤에야 허브가 움직이고, Claude가 시킨 일이라는 이름표가 남는다.", "img": "explain/img/dash_answer_m.webp", "img_wh": [920, 1800]}]}], "status": "idea", "section": "s3"}, {"id": "ai-api", "section": "s3", "kicker": "AI 붙이기 ② API", "title": "허브가 직접 Claude 부르기 — 초안 한 통에 1센트쯤", "lead": "허브가 정해 둔 때 스스로 Claude를 불러, 예를 들어 문의 답장 초안을 만들어 확인 요청에 올려 둔다. 값은 쓴 글 양(토큰 — AI가 글 양을 세는 단위)만큼 나간다.", "status": "idea", "flow": {"prev": "구독 방식 과정", "cur": "AI 붙이기 — API", "next": "API 방식 과정"}, "blocks": [{"type": "img", "src": "explain/img/fig_aiapi.webp", "alt": "허브 일꾼 → Claude API → 답장 초안 → 사람이 보내기, 아래에 어림 계산", "caption": "API 방식과 어림 계산", "howto": "검은 칸 = 허브 · 흰 칸 = Claude API · 노랑 = 사람 · 아래 = 1건 값 계산(추정)", "max_w": 720, "src_wh": [1440, 1802]}, {"type": "table", "head": ["모델(2026-11-21)", "넣는 글 100만 토큰", "받는 글 100만 토큰"], "rows": [["Opus 5.5", "$4", "$20"], ["Sonnet 5.5", "$2", "$10"], ["Haiku 5.5", "$0.10", "$0.50 (10만 토큰 이하 기준)"]]}, {"type": "big", "items": [{"num": "$0.009", "label": "답장 초안 1건", "note": "Sonnet 5.5, 넣는 글 2,000 · 받는 글 500 토큰으로 잡은 추정"}, {"num": "≈ $0.9", "label": "한 달 100건", "note": "같은 가정으로 곱한 추정"}]}, {"type": "note", "text": "실제 글 길이를 모르는 추정이다. API로 허브가 직접 부르는 기능은 아직 구상이고, 하루 한도(하루에 부를 수 있는 양의 상한)도 구상이다."}], "terms": [{"w": "토큰", "d": "AI가 글 양을 세는 단위. 한국어는 글자 수와 딱 맞지 않는다"}, {"w": "하루 한도", "d": "하루에 부를 수 있는 양의 상한. 넘으면 멈추고 알린다"}], "talk": "둘째는 API예요. 허브가 정해 둔 때 스스로 AI를 불러요. 예를 들어 문의가 오면 답장 초안을 만들어서 확인 요청에 올려 두는 식이에요. 돈은 쓴 만큼인데, 답장 초안 하나면 1센트쯤으로 어림돼요. 한 달 백 건이면 어림으로 1달러 안쪽이고요. 많이 쓰이지 않게 하루 한도를 걸고 넘으면 멈추게 할 거예요. 이건 아직 구상이에요.", "sources": "API 값 = platform.claude.com 가격 페이지(2026-11-21 확인: Opus 5.5 $4/$20 · Sonnet 5.5 $2/$10 · Haiku 5.5 $0.10/$0.50, 10만 토큰 이하). 어림 계산 = 2,000×$2/100만 + 500×$10/100만 = $0.009(직접 한 계산). 하루 한도 = docs\\04_오픈클로_완전자동화_구상.md ‘비용 폭주’(구상). 이 설명을 넣은 까닭 = 결정 182(외부 서비스 · API · 구독 · 비용 설명 요청)."}, {"id": "ai-api-how", "kicker": "AI 붙이기 ② API · 과정", "title": "API 방식 — 준비는 한 번, 평소엔 허브가 부른다", "lead": "처음 한 번 계정 · 결제 · 키 · 하루 한도를 준비한다. 평소에는 허브가 글만 보내고, 돌아온 초안을 사람이 보고 보낸다.", "flow": {"prev": "AI 붙이기 — API", "cur": "API 방식 과정", "next": "알림톡 붙이기"}, "terms": [{"w": "콘솔", "d": "API 계정 · 키 · 결제를 관리하는 Anthropic 웹 화면"}, {"w": "API 키", "d": "허브가 Claude API를 부를 때 쓰는 비밀 열쇠"}], "talk": "API로 붙이면 이렇게 가요. 처음에 Anthropic 계정 만들고 결제 붙이고, 키를 허브 설정에 넣고 하루 한도를 걸어요. 그 뒤로는 문의가 오면 허브가 글만 보내서 초안을 받아 오고, 확인 요청에 올라오면 사람이 보고 보낼지 정해요. 사진이나 얼굴은 안 보내요. 이건 아직 구상이에요.", "sources": "docs\\04_오픈클로_완전자동화_구상.md(결정 25에서 나온 Claude 구상) ‘비용 폭주’(구상). 계정 · 결제 절차는 붙일 때 다시 확인(직접 보지 못함).", "blocks": [{"type": "img", "src": "explain/img/fig_proc_api.webp", "alt": "처음 한 번 계정·결제, API 키, 하루 한도 준비와 평소 한 번 도는 과정", "caption": "처음 준비와 평소 한 번", "howto": "점선 칸 = 아직 안 만든 것 · 초록 = 바깥 서비스", "max_w": 720, "src_wh": [1440, 2074]}, {"type": "steps", "items": [{"t": "처음 한 번 — 계정과 결제(사람)", "d": "Anthropic 콘솔(API 계정 · 키 · 결제를 관리하는 웹 화면)에 가입하고 결제를 붙인다. 붙일 때 절차를 다시 확인한다.", "img": null}, {"t": "처음 한 번 — API 키와 하루 한도(개발자 · 사람)", "d": "키(허브가 Claude API를 부를 때 쓰는 비밀 열쇠)는 이 PC 안 허브 설정에만 둔다. 하루 한도를 넘으면 멈추고 알린다. 둘 다 구상.", "img": null}, {"t": "평소 — 허브가 부름", "d": "문의가 들어오는 것 같은 정해 둔 때에 글만 보낸다.", "img": null}, {"t": "평소 — 사람이 보고 보냄", "d": "초안은 확인 요청에 올라오고, 보낼지는 사람이 정한다.", "img": null}]}], "status": "idea", "section": "s3"}, {"id": "alimtalk", "section": "s3", "kicker": "바깥 서비스 붙이기", "title": "손님 알림톡 — 한 통 13원, 보내기는 승인 뒤", "lead": "예약 확정이나 사진 발송 같은 순간에 카카오톡 알림을 보내려면 바깥 서비스(솔라피)를 붙인다. 보내기는 사람 승인 뒤에만 나간다.", "status": "idea", "flow": {"prev": "API 방식 과정", "cur": "알림톡 붙이기", "next": "지금 어디까지"}, "blocks": [{"type": "img", "src": "explain/img/fig_proc_alimtalk.webp", "alt": "솔라피 가입, 카카오톡 채널(톡채널), 문구 틀 검수, 허브 연결 준비와 평소 상태 변화 → 초안 → 승인 → 발송 과정", "caption": "처음 준비와 평소 한 번", "howto": "점선 칸 = 아직 안 만든 것 · 초록 = 바깥 서비스 · 노랑 = 사람", "max_w": 720, "src_wh": [1440, 2336]}, {"type": "steps", "items": [{"t": "처음 한 번 — 솔라피 가입(사람)", "d": "건당 13원, 기본료 없음(부가세 별도).", "img": null}, {"t": "처음 한 번 — 카카오톡 채널(톡채널)과 문구 틀(사람)", "d": "스튜디오 톡채널(스튜디오 이름으로 된 카카오톡 공식 계정)을 연결하고, 보낼 문구 틀을 등록해 카카오 검수를 받는다. 일반적인 절차라 붙일 때 다시 확인한다.", "img": null}, {"t": "평소 — 허브가 초안", "d": "예약이 ‘확정’, 사진이 ‘보냄’으로 바뀌면 등록한 틀에 이름 · 날짜를 넣어 초안을 만든다(구상).", "img": null}, {"t": "평소 — 사람 승인 뒤 발송", "d": "승인하면 솔라피를 거쳐 손님 카카오톡으로 간다.", "img": null}]}, {"type": "note", "text": "하루 건수, 밤 시간 광고 금지, 수신 동의 검사를 허브 쪽에 넣는 것도 구상에 들어 있다. 같은 요청이 두 번 나가지 않게 막는 장치는 만들고 시험했다."}], "terms": [{"w": "솔라피", "d": "문자 · 알림톡을 대신 보내 주는 서비스"}, {"w": "톡채널(카카오톡 채널)", "d": "스튜디오 이름으로 된 카카오톡 공식 계정"}, {"w": "문구 틀", "d": "알림톡으로 보낼 수 있게 미리 등록해 검수받은 문장"}], "talk": "손님한테 알림톡을 보내게 하려면 이런 순서예요. 솔라피라는 서비스에 가입하고, 스튜디오 톡채널(카카오톡 채널)을 붙이고, 보낼 문구를 미리 등록해서 카카오 검수를 받아야 해요. 그다음엔 예약이 확정되거나 사진을 보내면 허브가 초안을 만들고, 승인하면 나가는 식이에요. 건당 13원이고요. 이건 아직 안 만들었어요.", "sources": "알림톡 값 = solapi.com/pricing(슬라이드 메모 출처, 1건 13원 VAT 미포함, 월 기본료 무료). 채널 · 문구 검수 = 알림톡 일반 절차(직접 확인하지 않음). 기능목록 10.5 한도 · 시간 · 동의 검사(구상) · 10.6 같은 요청 두 번 막기(만들고 시험함) · 1.3 상태."}, {"id": "status", "section": "s3", "kicker": "지금 어디까지", "title": "52개 만들고 시험함 — 진짜 사진은 아직", "lead": "2026년 11월 21일 아침 기준이다. 숫자는 모두 가짜 · 시험용 자료로 잰 것이다.", function showHelp(){ openSheet(el('<div class="hb-help"><button class="hb-x" data-close aria-label="닫기">✕</button><h3>쓰는 법</h3><ul style="padding-left:18px;margin:6px 0">'+
 '<li><b>문서 고르기</b> — 홈에 문서 네 개. 맨 위 \'이어 보기\'는 마지막에 보던 자리로 바로 감.</li>'+
 '<li><b>옮겨 다니기</b> — 아래 탭(넓은 화면은 왼쪽 목차와 위 ‹ ›): ⌂ 홈 · ☰ 목차(갈래 · 안 · 화면으로 바로) · ‹ › 앞뒤 안(화면) · ✎ 모아 보기. 키보드는 ← → 넘기기, / 찾기, Esc 닫기. 휴대폰 뒤로 가기는 앞에 보던 문서로.</li>'+
 '<li><b>체크</b> — 안(화면) 머리의 네모와 묶음 제목 옆 작은 네모. 뜻은 정해져 있지 않은 \'내 표시\'. 위 띠의 \'체크\'를 누르면 체크한 것만 보임.</li>'+
 '<li><b>메모</b> — 묶음(접힌 칸 · 그림 · 소제목 덩어리) 제목 옆 \'메모\'를 누르면 그 묶음 아래에 글 칸이 열림. 안(화면) 맨 아래에는 그 안 전체 메모 칸. 오른쪽 아래 \'메모\'는 지금 보는 안에 붙음. 적은 곳에는 작은 점이 남음.</li>'+
 '<li><b>펜</b> — ✎ 를 누르면 작은 창. 바깥을 누르거나 ✕ · Esc면 저장하고 닫힘. 새 장 · 지우개 · ↶ 되돌리기. 작은 그림을 누르면 크게 보기 · 이어 쓰기 · 지우기.</li>'+
 '<li><b>저장</b> — 적는 즉시 이 기기에 저장(새로고침해도 그대로). 인터넷이 되면 Claude가 읽는 곳에도 올라감(위 띠의 \'올림 hh:mm\').</li>'+
 '<li><b>Claude에게 넘기기</b> — 방에 "○○ 메모 봐"라고 하면 됨. 안 되면 ✎ 모아 보기 → 글 복사 · 파일로 저장.</li>'+

 '<li><b>미팅 노트</b> — 원래 쓰던 그대로. 물음 밑 \'이 답으로 정해지는 안\'을 누르면 AI 직원 구상의 그 안으로 가고, 아래 \'↩ 미팅 노트로\' 단추로 돌아옴.</li></ul><div class="hb-row"><button class="hb-btn pri" id="hb-help-inst">📲 앱으로 까는 법</button><button class="hb-btn" data-close>알겠음</button></div></div>')); var bi=$("#hb-help-inst"); if(bi) bi.onclick=showInstall; }

function parseHash(){ var h=location.hash.slice(1); try{ h=decodeURIComponent(h); }catch(e){} var i=h.indexOf("/"); return {v:i<0?h:h.slice(0,i),t:i<0?"":h.slice(i+1)}; }
