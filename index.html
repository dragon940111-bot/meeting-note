<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="대표님 미팅">
<title>대표님 미팅 노트</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a5bd9'/%3E%3Cpath d='M18 44 L40 22 L46 28 L24 50 L16 52 Z' fill='white'/%3E%3C/svg%3E"><link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233a5bd9'/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f3f0;--card:#fff;--ink:#1c1c1e;--sub:#6c6c72;--line:#e2e0db;--soft:#eeece8;--acc:#3a5bd9;--acc2:#e8edff;--ok:#2f9e6a;--ok2:#e3f5ec;--warn:#b7791f;--warn2:#fdf3e1;--no:#c2453d;--no2:#fbe9e7;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#121214;--card:#1d1d20;--ink:#f1f1f3;--sub:#a3a3aa;--line:#2f2f35;--soft:#28282d;--acc:#8aa2ff;--acc2:#262d4a;--ok:#52c48c;--ok2:#1d3328;--warn:#e0b45a;--warn2:#3a2f19;--no:#ff7a70;--no2:#3b2120}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 8px) 14px 8px}
.top .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top h1{font-size:17px;margin:0;flex:1;min-width:140px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
.pill.on{background:var(--acc);border-color:var(--acc);color:#fff}
.pill.warnon{background:var(--warn);border-color:var(--warn);color:#fff}
.prog{height:4px;background:var(--soft);border-radius:4px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.sync{font-size:11px;color:var(--sub)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:none;background:var(--soft);border-radius:99px;padding:8px 14px;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg)}
.tab .n{font-size:11px;opacity:.7;margin-left:4px}
main{padding:6px 14px calc(110px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.layout{display:block}
@media (min-width:900px){.layout{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
 .list{position:sticky;top:118px;max-height:calc(100vh - 140px);overflow:auto;padding-right:4px}
 .detail-pane{display:block}.inline-detail{display:none!important}}
@media (max-width:899px){.detail-pane{display:none}}
.sec{font-size:13px;color:var(--sub);margin:16px 2px 6px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:8px 0;overflow:hidden}
.card.sel{outline:2px solid var(--acc)}
.head{display:flex;gap:10px;align-items:flex-start;padding:12px;cursor:pointer}
.dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:6px;background:var(--line)}
.dot.asked{background:var(--ok)}.dot.later{background:var(--warn)}.dot.skip{background:var(--sub)}
.head .tt{flex:1;font-weight:600;font-size:15px}
.head .meta{font-size:12px;color:var(--sub);font-weight:400;margin-top:2px}
.must .head .tt:before{content:"꼭 ";color:var(--no);font-weight:700}
.body{padding:0 12px 14px;border-top:1px solid var(--line)}
.why{margin:10px 0 4px;font-size:14.5px}.why b,.tip b{color:var(--acc);font-weight:600;margin-right:4px}
.tip{font-size:14px;color:var(--sub);margin:4px 0 8px}
.status{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.status button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 12px;font-size:13px}
.status button.on.asked{background:var(--ok);color:#fff;border-color:var(--ok)}
.status button.on.later{background:var(--warn);color:#fff;border-color:var(--warn)}
.status button.on.skip{background:var(--sub);color:#fff;border-color:var(--sub)}
.lbl{font-size:12px;color:var(--sub);margin:12px 0 6px;font-weight:600}
.br{border:1px solid var(--line);border-radius:12px;margin:8px 0;overflow:hidden}
.br>.bh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--soft)}
.br.on{border-color:var(--acc)}.br.on>.bh{background:var(--acc2)}
.chk{flex:none;width:24px;height:24px;border:2px solid var(--sub);border-radius:7px;display:grid;place-items:center;font-size:14px;color:#fff}
.on>.bh .chk,.chk.on{background:var(--acc);border-color:var(--acc)}
.bh .a{flex:1;font-weight:600;font-size:14.5px}.bh .penq{flex:none;padding:6px 12px;font-size:16px;border-radius:99px}
.bb{padding:8px 12px 12px;display:none}.br.on .bb{display:block}
.sub{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.sub:last-child{border-bottom:none}
.sub .k{flex:none;font-size:11px;color:var(--sub);width:64px;padding-top:4px}
.sub .v{flex:1;font-size:14px}
.sub .chk{width:22px;height:22px;border-width:2px;cursor:pointer}
.react{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.react button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:12px}
.react button.on{background:var(--ink);color:var(--bg)}
textarea,input[type=text]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:15px;resize:vertical}
textarea{min-height:44px}
.small{font-size:13px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:14px}
.btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.danger{color:var(--no)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .th{position:relative;width:110px;height:82px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
.thumbs .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:6px;font-size:11px;padding:2px 6px}
.fig{margin-top:10px}.fig .cap{font-size:12px;color:var(--sub);margin:8px 0 4px}
.fig .flow{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}.fig .flow i{color:var(--sub);font-style:normal}.fig .st{padding:3px 8px;border-radius:99px;background:var(--soft)}
.fig .tree{background:var(--soft);border-radius:10px;padding:8px 10px;margin:6px 0}.fig .mono{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
.fig .ok{color:var(--ok);font-size:12px}.fig .no{color:var(--no);font-size:12px}
.fig .chat{background:var(--soft);border-radius:12px;padding:10px;display:grid;gap:6px}.fig .bub{max-width:85%;padding:7px 10px;border-radius:14px;font-size:14px}
.fig .bub.me{justify-self:end;background:#fee500;color:#1c1c1e}.fig .bub.you{justify-self:start;background:var(--card)}.fig .s{color:var(--sub);font-size:12px}
.fig .tw{overflow-x:auto}.fig table{border-collapse:collapse;font-size:13px;width:100%}.fig th,.fig td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}.fig th{color:var(--sub);font-weight:500}
.fig .svg{width:100%;max-width:420px;display:block}.fig .t{font-size:11px;fill:var(--ink)}.fig .t.c{text-anchor:middle}.fig .t.s{fill:var(--sub);font-size:10px}.fig .t.w{fill:#fff}
.fig .bx{fill:var(--card);stroke:var(--line)}.fig .ar{stroke:var(--acc);stroke-width:2;fill:none;marker-end:url(#a)}.fig .pp{fill:var(--acc)}.fig .pp2{fill:var(--sub)}
.fig .shot{width:100%;border-radius:10px;border:1px solid var(--line)}.fig .shot.narrow{max-width:200px}
details.more{margin-top:8px}details.more summary{font-size:13px;color:var(--acc);cursor:pointer}
.empty{color:var(--sub);font-size:14px;padding:30px 10px;text-align:center}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;display:flex;gap:10px}
.fab button{border:none;border-radius:99px;padding:14px 18px;font-size:15px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.fab .f1{background:var(--ink);color:var(--bg)}.fab .f2{background:var(--acc);color:#fff}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);display:none;align-items:flex-end;justify-content:center}
.sheet.open{display:flex}
.sheet .in{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 10px;font-size:17px}
.qn{border-bottom:1px solid var(--line);padding:8px 0;font-size:14px}.qn .tm{font-size:11px;color:var(--sub)}
.hide-mine .mine{display:none!important}
.hide-mine .fig{display:block}
.fivemin .nonmust{display:none!important}
.banner{background:var(--warn2);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
/* 펜 */
.pad{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.28);display:none;align-items:center;justify-content:center;padding:16px}
.pad.open{display:flex}
.pad .box{width:min(94vw,760px);height:min(64vh,560px);background:var(--card);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.3)}
@media (max-width:600px){.pad{align-items:flex-end;padding:0}.pad .box{width:100vw;height:62vh;border-radius:18px 18px 0 0}}
.pad .bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
.pad .bar .ttl{flex:1;font-weight:600;font-size:14px;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid transparent;flex:none}
@media (max-width:600px){.pad .bar .ttl{flex-basis:100%}.pad .bar .btn{padding:6px 9px}}
.sw.on{border-color:var(--acc)}
.pad .wrapc{flex:1;position:relative;overflow:hidden;background:#fff}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad .hint{position:absolute;left:10px;bottom:10px;font-size:12px;color:#888;pointer-events:none}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80;max-width:90vw;text-align:center}.toast.on{opacity:1;transform:translateX(-50%)}
.viewer{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px}.viewer.open{display:flex}.viewer img{max-width:94vw;max-height:84vh;border-radius:8px}.viewer span{color:#ddd;font-size:13px}
.gl{border-bottom:1.5px dotted var(--acc);cursor:help}
.terms{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--sub);margin:2px 0 10px}
.terms .gl{border-bottom:none;background:var(--acc2);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:13px}
.export pre{white-space:pre-wrap;font-size:12px;background:var(--soft);padding:10px;border-radius:10px;max-height:300px;overflow:auto}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3a5bd9"/></marker></defs></svg>
<div class="top">
 <div class="row">
  <h1>대표님 미팅 노트</h1>
  <button class="pill" id="bTimer">시작</button>
  <button class="pill" id="b5">5분 모드</button>
  <button class="pill" id="bHide" title="대표님과 화면을 같이 볼 때 내 메모 · 제안을 숨겨요">같이 보기</button>
  <button class="pill" id="bHelp">상황별 도움</button>
 </div>
 <div class="prog"><i id="progBar"></i></div>
 <div class="row" style="margin-top:4px"><span class="sync" id="progTxt"></span><span class="sync" id="syncTxt" style="margin-left:auto"></span></div>
</div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="fab"><button class="f1" id="fQuick">빠른 메모</button><button class="f2" id="fPen">✎ 펜</button></div>

<div class="toast" id="toast"></div><div class="viewer" id="viewer" onclick="this.classList.remove('open')"><img alt="사진 크게 보기"><span>아무 데나 누르면 닫혀요</span></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="pad" id="pad"><div class="box" id="padBox">
 <div class="bar">
  <span class="ttl" id="padTitle">펜 메모</span>
  <button class="sw" data-c="#111111" style="background:#111"></button>
  <button class="sw" data-c="#d93025" style="background:#d93025"></button>
  <button class="sw" data-c="#1a56db" style="background:#1a56db"></button>
  <button class="sw" data-c="#e9a400" style="background:#e9a400"></button>
  <button class="btn small" id="pW">가늘게</button>
  <button class="btn small" id="pE">지우개</button>
  <button class="btn small" id="pU" title="되돌리기">↶</button>
  <button class="btn small" id="pC">새 장</button>
  <button class="btn small pri" id="pS">✓ 저장</button>
  <button class="btn small" id="pX" title="닫기(저장됨)">✕</button>
 </div>

 있어야 '선수 찾기'와 '1차 셀렉'이 대표님 기준에 맞는지 잴 수 있어요. 선수 명단은 사진 속 번호표를 이름으로 바꿀 때, 순서표는 사진이 찍힌 시각을 보고 어느 체급 차례였는지 가를 때(체급 구간) 써요 — 아래 '그림 · 예시 보기' 참고.", "tip": "명단 · 순서표는 엑셀 · 사진 · 종이 무엇이든 괜찮다고.", "br": [{"a": "고른 결과가 라이트룸에 있어요", "n": "카탈로그 백업 파일(.lrcat)을 받을 수 있는지", "c": "정답지 바로 생김", "s": "카탈로그가 어려우면 별점만 뽑아 낸 목록도 괜찮아요"}, {"a": "고른 걸 따로 폴더에 모아요", "n": "그 폴더를 통째로", "c": "그 폴더가 곧 정답지", "s": ""}, {"a": "명단이 없어요", "n": "주최 측에는 명단이 있는지", "c": "이름 없이 번호표만으로 시험", "s": ""}], "fig": "<div class=\"cap\">선수 명단 예시(가짜)<\/div><div class=\"tw\"><table><tr><th>번호<\/th><th>이름<\/th><th>종목<\/th><th>체급<\/th><\/tr><tr><td>137<\/td><td>김하늘<\/td><td>남자 보디<\/td><td>-75kg<\/td><\/tr><tr><td>52<\/td><td>박서준<\/td><td>클래식<\/td><td>-70kg<\/td><\/tr><\/table><\/div><div class=\"cap\">순서표 예시(가짜)<\/div><div class=\"tw\"><table><tr><th>시간<\/th><th>종목 · 체급<\/th><\/tr><tr><td>10:00<\/td><td>남자 보디 -75kg<\/td><\/tr><tr><td>10:40<\/td><td>클래식 -70kg<\/td><\/tr><\/table><\/div>"}, {"id": "B2", "t": "그 대회에서 누가 어떤 사진을 샀는지", "why": "'번호로 꺼내기'와 판매 흐름을 실제처럼 시험해요. 예를 들어 '137번 선수가 사진 5장을 샀다'는 기록이 있으면, 허브가 그 선수 사진을 제대로 모아 오는지 견줘 볼 수 있어요.", "tip": "", "br": [{"a": "엑셀로 적어 둬요", "n": "", "c": "바로 시험", "s": ""}, {"a": "카톡으로만 주고받아요", "n": "이름 · 번호를 가린 대화 캡처 몇 개", "c": "카톡 대화에서 '누가 무엇을 샀는지' 뽑아 내는 시험", "s": ""}, {"a": "주최 측 쇼핑몰로 팔아요", "n": "주문 목록을 내려받을 수 있는지", "c": "허브가 쇼핑몰 주문 목록을 읽게 함", "s": ""}], "fig": ""}, {"id": "B3", "t": "상담 대화 10~20건(가린 캡처) + 가격표 · 안내문 · 환불 규정", "why": "답장 초안이 대표님 말투와 규칙(가격 · 환불)을 지키게 하는 기준이에요. 답장 초안에 들어가는 가격 · 날짜 같은 숫자는 AI가 지어내지 않고, 허브 장부(가격표 등)에 적힌 것만 쓰게 만들 거예요.", "tip": "이름 · 전화번호는 가려 달라고.", "br": [{"a": "카톡 채널", "n": "대화 내보내기가 되는지", "c": "", "s": ""}, {"a": "개인 카톡 · 인스타", "n": "이름 · 번호를 가린 캡처", "c": "", "s": ""}, {"a": "가격표가 없어요", "n": "말로만 정해 두신 가격 · 규칙", "c": "답장 초안에 가격을 넣지 않음(가격은 사람이 직접 적음)", "s": ""}], "fig": "<div class=\"chat\"><div class=\"bub you\"><span class='blk'>████<\/span>님 안녕하세요, 12월 둘째 주 바디프로필 가능할까요?<\/div><div class=\"bub me\">네 가능해요! 토요일 오후 2시 어떠세요? <span class='s'>(이름 · 번호는 이렇게 가려서)<\/span><\/div><\/div>"}, {"id": "B4", "t": "다음 대회 때 현장에 따라가 보기 + 명단 · 순서표 미리", "why": "대회 날 메모리 카드를 언제 · 누가 컴퓨터로 옮기는지, 현장 판매대(사진 파는 자리)가 어떻게 돌아가는지 눈으로 봐야 해요. 명단 · 순서표를 미리 받으면 대회 날 허브를 실제로 돌려 볼 수 있어요.", "tip": "", "br": [{"a": "오세요", "n": "날짜 · 무엇을 볼지", "c": "대회 날 현장에서 시험할 계획 세우기", "s": "무대 위 '지금 누구' 판(지금 무대에 선 선수 번호를 보여 주는 판 · 화면) 같은 새 아이디어도 그날 작게 시험"}, {"a": "현장은 어려워요", "n": "현장 사진 · 영상으로라도 보여 주실 수 있는지", "c": "", "s": ""}], "fig": ""}, {"id": "B5", "t": "스튜디오 컴퓨터에 시험판을 깔아 봐도 되는지 · 언제", "why": "진짜 환경(디스크 · 프로그램 · 와이파이)에서 돌려야 숨은 문제가 보여요. 예를 들어 스튜디오 와이파이가 느리거나 디스크 글자가 자주 바뀌는 문제는 직접 깔아 봐야 알 수 있어요.", "tip": "\"원본은 지우지 않고, 옮기기만 해요. 언제든 끌 수 있어요.\"", "br": [{"a": "돼요", "n": "언제 깔지 · 그 PC를 누가 쓰는지", "c": "설치 날짜 잡기", "s": "처음엔 '보기만' 모드로 — 사진을 읽기만 하고 아무것도 옮기거나 바꾸지 않게"}, {"a": "아직이요", "n": "무엇이 걱정되시는지", "c": "경일 노트북으로 시연만", "s": ""}], "fig": "<div class=\"cap\">지금 만든 허브 현황판 (가짜 자료로 찍은 화면)<\/div>\n<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJHA+gDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDgqSgnAzXsuifDjQYNIim1dHnnMQlldpmRU4ycYI4HqaAPGaSvadY+G2gXOkyy6SjwT+UZIZFmZ1fjIzkng+1eK54zQAUlXYtLvprxrOO2c3CLvaM4BC4Bzz7EUSaTfxedvtmAhx5hyMLkZHOfSgClSVfOjajmUC1cmJijYI6jqB649s1Ha6Ze3cPnW9s7xb1TcOm48CgCnSGrZ029Az9ll27Gk3BeNq5yc+2D+VVKAEpDS <text x=\"160\" y=\"18\" class=\"t c s\">__일<\/text><circle cx=\"235\" cy=\"30\" r=\"6\" fill=\"var(--acc)\"/><text x=\"235\" y=\"52\" class=\"t c\">보정<\/text><text x=\"235\" y=\"18\" class=\"t c s\">__일<\/text><circle cx=\"310\" cy=\"30\" r=\"6\" fill=\"var(--acc)\"/><text x=\"310\" y=\"52\" class=\"t c\">납품<\/text><text x=\"310\" y=\"18\" class=\"t c s\">__일<\/text><\/svg>"}, {"id": "Q1", "t": "촬영자들은 사진을 어떻게 넘기나요? 집에서 올리면 JPEG만도 될까요?", "why": "사진이 허브로 들어오는 길('받기' 입구)을 정해요. JPEG는 RAW보다 파일이 훨씬 작아서 JPEG만 먼저 받으면 용량이 확 줄고, RAW는 팔린 사진만 나중에 받으면 돼요 — 이건 대표님이 정할 일이에요.", "tip": "", "br": [{"a": "카드를 모아요", "n": "누가 언제 카드를 모으는지", "c": "지금 만든 '받기' 그대로", "s": ""}, {"a": "각자 집에서 보내요", "n": "어디로(드라이브 등)", "c": "클라우드(드라이브)로 들어오는 입구 만들기", "s": "JPEG만 먼저, RAW는 팔린 것만"}, {"a": "RAW+JPEG 둘 다 와요", "n": "", "c": "", "s": ""}], "fig": ""}, {"id": "Q2", "t": "선수별로 어떻게 찾고 고르나요? 별점 · 색은 무슨 뜻? 직원이 먼저 고르나요?", "why": "허브가 별점을 대표님 뜻대로 써야 라이트룸에서 헷갈리지 않아요. 예를 들어 대표님 스튜디오에서 ★3이 '후보'인데 허브가 ★3을 '납품할 것'으로 쓰면 둘이 뒤섞여요.", "tip": "아래 '그림 · 예시 보기' 표의 오른쪽 칸을 채우기.", "br": [{"a": "별점 뜻이 정해져 있어요", "n": "그 뜻을 표에 채우기", "c": "허브의 기본 설정(기본값)을 대표님 뜻으로 맞춤", "s": ""}, {"a": "그때그때 달라요", "n": "", "c": "허브는 별점을 건드리지 않게 함", "s": ""}, {"a": "직원이 먼저 골라요", "n": "직원 셀렉과 대표님 셀렉을 따로 보는지", "c": "직원이 고른 것을 따로 적는 칸을 만듦", "s": ""}], "fig": "<div class=\"tw\"><table><tr><th>별점·색<\/th><th>대표님 스튜디오에서 뜻 (예시 — 실제로 물어 채우기)<\/th><\/tr><tr><td>★1<\/td><td>버림<\/td><\/tr><tr><td>★3<\/td><td>후보<\/td><\/tr><tr><td>★5<\/td><td>납품<\/td><\/tr><tr><td>빨강<\/td><td>보정 필요?<\/td><\/tr><tr><td>초록<\/td><td>손님이 고름?<\/td><\/tr><\/table><\/div>"}, {"id": "Q3", "t": "다른 선수가 크게 나온 단체 사진은?", "why": "한 사진에 두 선수가 크게 나오면 누구에게 줄지 규칙이 필요해요. 예를 들어 137번 선수 사진에 52번 선수도 크게 같이 나오면, 52번에게도 줄지 정해야 해요.", "tip": "", "br": [{"a": "둘 다에게 줘요", "n": "", "c": "두 선수 폴더에 다 넣음", "s": ""}, {"a": "주인공에게만", "n": "주인공은 어떻게 정하는지(가운데 · 크기)", "c": "주인공 폴더에만 넣음", "s": ""}, {"a": "안 줘요", "n": "", "c": "단체 사진은 따로 묶음", "s": ""}], "fig": "<div class=\"cap\">다른 선수가 크게 나온 사진 (그림 예)<\/div>\n<svg viewBox=\"0 0 320 120\" class=\"svg\"><rect x=\"6\" y=\"6\" width=\"308\" height=\"108\" rx=\"8\" fill=\"var(--soft)\"/>\n<circle cx=\"110\" cy=\"40\" r=\"16\" class=\"pp\"/><rect x=\"92\" y=\"58\" width=\"36\" height=\"46\" rx=\"8\" class=\"pp\"/><text x=\"110\" y=\"86\" class=\"t c w\">137<\/text>\n<circle cx=\"200\" cy=\"44\" r=\"13\" class=\"pp2\"/><rect x=\"186\" y=\"58\" width=\"28\" height=\"40\" rx=\"7\" class=\"pp2\"/><text x=\"200\" y=\"82\" class=\"t c w\">52<\/text>\n<text x=\"110\" y=\"18\" class=\"t c s\">주인공?<\/text><text x=\"200\" y=\"22\" class=\"t c s\">같이 크게<\/text><\/svg>"}, {"id": "Q4", "t": "보정은 누가 하고, 손님 수정 요청은 어떻게 받나요?", "why": "사진 위에 메모 · 펜으로 표시하고 보정을 지시하는 기능(아직 안 만듦 — 다음에 정할 것)을 얼마나 크게 만들지가 여기서 정해져요.", "tip": "", "br": [{"a": "대표님이 다 해요", "n": "", "c": "사진 메모 기능은 가볍게만", "s": ""}, {"a": "외주에 맡겨요", "n": "외주 업체에 보정 지시를 어떻게 전하는지(카톡 · 메일 · 그림)", "c": "보정 지시서 기능이 중요해짐", "s": "사진 위에 표시 + 번호 붙은 지시 + '처리함' 체크"}, {"a": "수정은 카톡으로 와요", "n": "수정을 몇 번까지 해 주는지", "c": "", "s": "카톡으로 온 수정 요청을 사진마다 보정 지시서로 바꿔 주기"}], "fig": ""}, {"id": "Q5", "t": "대회 뒤 사진 사겠다는 연락 — 하루 몇 건, 찾는 데 몇 분? 어떻게 파나요?", "why": "판매 쪽 기능을 얼마나 크게 만들지 정해요. 가격 이야기는 오늘 약속하지 않기.", "tip": "", "br": [{"a": "하루 0~2건", "n": "", "c": "지금 '번호로 꺼내기'로 충분", "s": ""}, {"a": "많아요", "n": "한 건 찾는 데 시간이 얼마나 드는지", "c": "바로 답해 주는 기능(즉답)을 앞당김", "s": "번호만 넣으면 미리보기 묶음 + 답장 초안"}, {"a": "묶음으로 팔아요", "n": "묶음을 어떻게 나누는지(몇 장 · 어떤 사진끼리)", "c": "", "s": ""}], "fig": ""}, {"id": "Q6", "t": "주최 측과는 어떤 약속? 선수 연락처 · 스튜디오가 따로 팔아도 되는지", "why": "스튜디오가 선수에게 직접 알리거나 팔 수 있는지가 갈려요. 예를 들어 주최 측과 독점 계약이 되어 있으면, 스튜디오가 따로 사진을 팔거나 선수에게 연락하는 게 막혀 있을 수 있어요.", "tip": "", "br": [{"a": "독점 계약이에요", "n": "계약 기간이 언제까지인지", "c": "", "s": ""}, {"a": "주최 측 쇼핑몰로만", "n": "스튜디오 페이지를 따로 열어도 되는지", "c": "판매 기능은 뒤로", "s": ""}, {"a": "연락처를 받아요", "n": "광고 · 알림을 보내도 된다는 동의(수신 동의)를 받았는지", "c": "선수에게 알림 보내는 기능을 만들 수 있음", "s": ""}], "fig": ""}, {"id": "Q7", "t": "문의는 어디로 가장 많이 오고 누가 답하나요? 예약은 어디에?", "why": "상담 비서(문의를 읽고 답장 초안을 써 두는 허브 기능)를 어디에 붙일지, 예약 기록을 허브로 어떻게 옮겨 올지 정해요.", "tip": "", "br": [{"a": "카톡 채널", "n": "하루 몇 건", "c": "카톡 채널 쪽을 먼저 만듦", "s": ""}, {"a": "네이버 예약", "n": "", "c": "허브가 네이버 예약을 읽어 오게 함", "s": ""}, {"a": "전화가 많아요", "n": "", "c": "통화한 내용을 메모로 남기는 기능", "s": ""}], "fig": ""}, {"id": "Q8", "t": "직원이 한 명 더 있다면 무슨 일을? AI에게 맡기기 싫은 일은?", "why": "AI 직원 기능을 무엇부터 만들지, 그리고 어디까지만 맡길지(이 선을 넘는 일은 AI가 하지 않음)를 정해요.", "tip": "", "br": [{"a": "상담 · 예약 정리", "n": "", "c": "상담 비서를 먼저 만듦", "s": ""}, {"a": "사진 정리 · 셀렉", "n": "", "c": "밤샘 처리를 먼저 만듦", "s": ""}, {"a": "손님에게 직접 답하는 건 싫어요", "n": "", "c": "AI는 초안만, 보내기는 사람", "s": "지금도 그렇게(AI는 초안만) 만들고 있다고 말씀드리기"}], "fig": ""}], "later": {"C": "외부 작가 카메라가 섞이는지 · 한 카드에 두 행사를 찍는지 · 모니터 두 대로 상담하는지", "B": "바디프로필 촬영 1건 전체(손님 허락 받은 것) · 보정한 납품본 몇 장 · 2주 동안 일마다 걸린 시간 간단히", "Q": "사진 보관 기간 · 지우는 때 · 사진을 잃은 적 · 밖에서 폰으로 보고 싶은 것 · 사진에 메모나 펜 표시를 하는지"}}</script>

var GLOSS = [["허브", "우리가 만들고 있는 프로그램이에요. 스튜디오 컴퓨터에서 돌면서 사진 받기 · 정리 · 선수별로 나누기 · 납품을 도와줘요. 예를 들어 대회 카드를 꽂으면 사진을 옮기고 선수별 폴더까지 만들어 두는 식이에요."], ["현황판", "허브를 켜면 보이는 첫 화면이에요. 오늘 할 일 · 일정 · 진행 상황을 한눈에 보여 줘요."], ["원본", "카메라가 찍은 그대로의 사진 파일이에요. 보정하거나 이름을 바꾸기 전 것."], ["RAW", "카메라가 찍은 그대로 저장하는 큰 사진 파일 종류예요(.CR3 · .NEF · .ARW 등). 보정할 여유가 커요."], ["JPEG", "흔히 쓰는 사진 파일(.jpg)이에요. 작고 어디서나 바로 열려요."], ["셀렉", "많은 사진 가운데 쓸 사진을 고르는 일이에요. 예를 들어 연사로 비슷하게 찍힌 10장 중 가장 잘 나온 1장을 남기는 것."], ["1차 셀렉", "사람이 보기 전에 허브가 먼저 후보를 골라 두는 것이에요. 흔들린 사진 · 눈 감은 사진 같은 것을 먼저 걸러 두고, 마지막은 사람이 고쳐요."], ["정답지", "대표님이 실제로 고른 사진 목록이에요. 허브가 맞게 골랐는지 견주는 기준이 돼요. 예를 들어 대표님이 고른 200장 중 허브도 180장을 골랐다면 많이 맞힌 거예요."], ["라이트룸", "어도비의 사진 고르기 · 보정 프로그램이에요. 'Classic'은 컴퓨터에 깔아 쓰는 판."], ["카탈로그", "라이트룸이 별점 · 보정 기록을 모아 두는 파일(.lrcat)이에요. 사진 자체는 안 들어 있고 '어느 사진에 별 몇 개 · 어떤 보정'만 적혀 있어요. 이걸 받으면 대표님이 무엇을 골랐는지 알 수 있어요."], [".lrcat", "라이트룸 카탈로그 파일의 끝 이름이에요."], ["캡처원", "사진 고르기 · 보정 프로그램(Capture One)이에요. 라이트룸과 비슷해요."], ["포토 메카닉", "사진을 아주 빨리 훑어 고르는 프로그램(Photo Mechanic)이에요."], ["프리셋", "보정 값을 묶어 저장한 것이에요. 누르면 여러 사진에 같은 느낌이 한 번에 입혀져요. 예를 들어 '무대 조명용' 프리셋 하나로 대회 사진 전체의 색을 맞추는 식."], ["별점", "라이트룸에서 사진에 붙이는 ★1~5 표시예요. 스튜디오마다 뜻이 달라요. 예를 들어 어떤 곳은 ★3이 '후보', ★5가 '납품'이에요."], ["색 라벨", "라이트룸에서 사진에 붙이는 색 표시(빨강 · 초록 등)예요."], ["테더링", "카메라를 선으로 컴퓨터에 이어서, 찍자마자 컴퓨터로 사진이 들어오게 하는 방법이에요. 스튜디오 촬영에서 손님이 모니터로 바로 보며 고를 때 많이 써요."], ["메모리 카드", "카메라 안에 꽂는 저장 카드(SD 카드 등)예요. 줄여서 '카드'."], ["외장 디스크", "USB로 꽂는 저장 장치예요(외장 하드 · 외장 SSD)."], ["SSD", "빠른 저장 장치예요. 외장 SSD는 USB로 꽂는 것."], ["NAS", "스튜디오 안 인터넷 공유기에 연결해 여러 컴퓨터가 같이 쓰는 저장 상자예요. 예를 들어 사무실 컴퓨터와 보정 컴퓨터가 같은 사진 폴더를 함께 여는 식."], ["클라우드", "구글 드라이브 · 네이버 MYBOX처럼 인터넷 너머에 파일을 두는 곳이에요."], ["드라이브", "여기서는 구글 드라이브 같은 인터넷 저장 공간을 말해요."], ["백업", "같은 파일을 다른 곳에도 복사해 두는 것이에요. 한 곳이 망가져도 남게. 예를 들어 카드 사진을 외장 디스크와 NAS 두 곳에 복사해 두기."], ["TB", "저장 용량 단위예요. 1TB = 1,000GB. 사진 3만 장이 1TB쯤 될 수 있어요."], ["본체 번호", "카메라마다 다른 고유 번호(시리얼 번호)예요. 사진 파일 안에 적혀 있어서 '어느 카메라로 찍었는지' 가를 수 있어요. 예를 들어 같은 기종 두 대라도 번호가 다르면 A캠 · B캠으로 나눠져요."], ["저작권 정보", "카메라 메뉴에 작가 이름을 넣어 두면, 찍는 사진마
